<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#173c2a">
  <title>Christmas Elf Test · GameBox</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <a class="backBtn" href="../" aria-label="Back to GameBox">GAME BOX</a>
      <div class="title">
        <strong>Christmas Elf Test</strong>
        <span id="actionLabel">LOADING CODED SPRITE…</span>
      </div>
      <div class="sourceBadge">84×84<br>CODED</div>
    </header>

    <main class="stageWrap" id="stageWrap">
      <canvas id="game" width="384" height="256" aria-label="Christmas elf sprite movement test"></canvas>
      <div id="loadError" class="loadError" hidden></div>

      <div class="controls">
        <div id="joystick" class="joystick" aria-label="Movement joystick">
          <div class="joyRing"><div id="joyKnob" class="joyKnob"></div></div>
          <span>MOVE</span>
        </div>
      </div>

      <div class="sourceInfo">
        <strong id="directionLabel">SOUTH</strong>
        <span id="frameLabel">Loading exact coded frames…</span>
      </div>
      <div class="hint">Joystick or WASD / arrow keys</div>
    </main>
  </div>

  <script src="elf-data-1.js?v=1"></script>
  <script src="elf-data-2.js?v=1"></script>
  <script src="elf-data-3.js?v=1"></script>
  <script src="elf-data-4.js?v=1"></script>
  <script src="elf-data-5.js?v=1"></script>
  <script src="elf-data-6.js?v=1"></script>
  <script src="elf-data-7.js?v=1"></script>
  <script src="elf-data-8a.js?v=1"></script>
  <script src="elf-data-8b.js?v=1"></script>
  <script src="elf-data-8c.js?v=1"></script>
  <script src="elf-data-9a.js?v=1"></script>
  <script src="elf-data-9b.js?v=1"></script>
  <script src="elf-sprite.js?v=1"></script>
  <script src="game.js?v=3"></script>
</body>
</html>
