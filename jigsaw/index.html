<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#173f68">
<title>Jigsaw · GameBox</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<div class="app">
  <header class="hud">
    <a class="kenneySquare hudButton" href="../" aria-label="Back to GameBox">
      <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/arrowLeft.png" alt="">
    </a>
    <div class="titleBlock">
      <small>JIGSAW</small>
      <strong id="puzzleTitle">Christmas Test</strong>
    </div>
    <div class="progress" aria-label="Puzzle progress">
      <span class="progressLabel">PLACED</span>
      <span class="progressValue"><b id="placedCount">0</b><i>/</i><b id="totalCount">36</b></span>
    </div>
    <button id="menuButton" class="kenneySquare hudButton" type="button" aria-label="Puzzle options">
      <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/gear.png" alt="">
    </button>
  </header>
  <main class="stage" aria-label="Jigsaw puzzle">
    <canvas id="puzzleCanvas"></canvas>
    <div class="trayLabel" aria-hidden="true">PIECES</div>
  </main>
</div>

<div id="menuSheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="menuTitle">
  <div class="sheetCard">
    <div class="sheetHead">
      <div><small>JIGSAW</small><strong id="menuTitle">Puzzle Options</strong></div>
      <button id="closeMenu" class="kenneySquare compactSquare" type="button" aria-label="Close options">
        <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/cross.png" alt="">
      </button>
    </div>

    <section class="settingPanel" aria-labelledby="piecesLabel">
      <div class="settingTitle">
        <span class="settingIcon"><img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/menuGrid.png" alt=""></span>
        <div><small>DIFFICULTY</small><strong id="piecesLabel">Pieces</strong></div>
      </div>
      <div class="pieceChoices" id="pieceChoices" role="group" aria-label="Number of puzzle pieces">
        <button type="button" data-piece-grid="2" aria-pressed="false">4</button>
        <button type="button" data-piece-grid="3" aria-pressed="false">9</button>
        <button type="button" data-piece-grid="4" aria-pressed="false">16</button>
        <button type="button" data-piece-grid="5" aria-pressed="false">25</button>
        <button type="button" data-piece-grid="6" class="selected" aria-pressed="true">36</button>
        <button type="button" data-piece-grid="7" aria-pressed="false">49</button>
        <button type="button" data-piece-grid="8" aria-pressed="false">64</button>
        <button type="button" data-piece-grid="9" aria-pressed="false">81</button>
        <button type="button" data-piece-grid="10" aria-pressed="false">100</button>
        <button type="button" data-piece-grid="11" aria-pressed="false">121</button>
        <button type="button" data-piece-grid="12" aria-pressed="false">144</button>
        <button type="button" data-piece-grid="13" aria-pressed="false">169</button>
      </div>
    </section>

    <div class="optionGrid">
      <button id="guideButton" class="kenneyLong optionButton" type="button">
        <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/target.png" alt="">
        <span class="optionCopy"><small>GUIDE</small><strong id="guideState">Off</strong></span>
      </button>
      <button id="soundButton" class="kenneyLong optionButton" type="button">
        <img id="soundIcon" src="../assets/gamebox/kenney/icons/Game Icons/White/2x/audioOn.png" alt="">
        <span class="optionCopy"><small>SOUND</small><strong id="soundState">On</strong></span>
      </button>
    </div>

    <button id="restartButton" class="kenneyLong menuAction" type="button">
      <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/return.png" alt=""><span>Restart puzzle</span>
    </button>
    <button id="chooseImage" class="kenneyLong menuAction" type="button">
      <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/import.png" alt=""><span>Use another image</span>
    </button>
    <input id="imageFile" type="file" accept="image/*" hidden>
    <a class="kenneyLong menuAction homeAction" href="../">
      <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/home.png" alt=""><span>Back to GameBox</span>
    </a>
  </div>
</div>

<div id="winOverlay" class="winOverlay" role="dialog" aria-modal="true" aria-labelledby="completeTitle">
  <div class="winCard">
    <div class="completeMark" aria-hidden="true">
      <img src="../assets/gamebox/kenney/ui/UI Adventure Pack/iconCheck_blue.png" alt="">
    </div>
    <small>PUZZLE COMPLETE</small>
    <h1 id="completeTitle">Picture restored!</h1>
    <p>You placed all <strong id="winPieceCount">36</strong> pieces.</p>
    <div class="winActions">
      <button id="winRestart" class="kenneyLong completionAction" type="button">
        <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/return.png" alt=""><span>Play again</span>
      </button>
      <button id="winHome" class="kenneyLong completionAction" type="button">
        <img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/home.png" alt=""><span>GameBox</span>
      </button>
    </div>
  </div>
</div>

<script src="jigsaw-engine.js?v=6"></script>
<script src="game.js?v=4"></script>
</body>
</html>
