name: North Pole Dash

on:
  push:
    paths:
      - 'christmas-dash/**'
      - 'hub/index.html'
      - 'index.html'
      - 'hub/chipin-gamebox.css'
      - '.github/workflows/north-pole-dash.yml'
  pull_request:
    paths:
      - 'christmas-dash/**'
      - 'hub/index.html'
      - 'index.html'
      - '.github/workflows/north-pole-dash.yml'

jobs:
  runner-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run North Pole Dash mechanics and syntax tests
        run: |
          node --check christmas-dash/engine.mjs
          node --check christmas-dash/game.js
          node --test christmas-dash/engine.test.mjs
          node --check christmas-dash/browser-smoke.cjs
      - name: Inspect Quaternius elf skin materials and mesh structure
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('shared/asset-pool/quaternius/ultimate-animated-character/Elf.gltf','utf8'));
          console.log('ELF_ASSET_MATERIALS',JSON.stringify((a.materials||[]).map((x,i)=>({i,name:x.name,pbr:x.pbrMetallicRoughness?.baseColorFactor,textures:x.pbrMetallicRoughness?.baseColorTexture}))));
          console.log('ELF_ASSET_MESHES',JSON.stringify((a.meshes||[]).map((x,i)=>({i,name:x.name,primitives:x.primitives?.map(p=>({material:p.material,attrs:Object.keys(p.attributes||{})}))})).slice(0,35)));
          console.log('ELF_ASSET_NODES',JSON.stringify((a.nodes||[]).filter(x=>x.mesh!==undefined).map(x=>({name:x.name,mesh:x.mesh,skin:x.skin})).slice(0,35)));
          NODE
      - name: Verify original winter artwork and menu integration
        run: |
          test -f shared/asset-pool/quaternius/ultimate-animated-character/Elf.gltf
          test -f shared/asset-pool/quaternius/ultimate-nature/PineTree_Snow_2.fbx
          test -f shared/asset-pool/quaternius/ultimate-nature/PineTree_Snow_4.fbx
          test -f assets/gamebox/kenney/2d/Platformer\ Assets\ Holiday/present_small_red.png
          test -f assets/gamebox/kenney/icons/Game\ Icons/White/2x/home.png
          grep -q 'href="christmas-dash/"' index.html
          grep -q 'href="christmas-dash/"' hub/index.html
          python3 tools/sync-entry-points.py --check
      - name: Install browser smoke test driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Confirm Chromium
        run: which google-chrome || which chromium
      - name: Serve GameBox locally
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/north-pole-http.log 2>&1 &
          sleep 2
      - name: Test real 3D model loading, swipes, pause and restart on mobile
        run: node christmas-dash/browser-smoke.cjs
      - name: Upload test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-pole-dash-browser-screenshots
          path: christmas-dash/*.png
          if-no-files-found: ignore
