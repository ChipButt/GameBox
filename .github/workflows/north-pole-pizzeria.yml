name: North Pole Pizzeria
on:
  push:
    paths:
      - 'north-pole-pizzeria/**'
      - 'index.html'
      - 'hub/index.html'
      - 'hub/chipin-gamebox.css'
      - '.github/workflows/north-pole-pizzeria.yml'
  pull_request:
    paths:
      - 'north-pole-pizzeria/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/north-pole-pizzeria.yml'
  workflow_dispatch:
jobs:
  pizzeria-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test recipe variety, cooking scores and upgrades
        run: |
          node --check north-pole-pizzeria/engine.mjs
          node --check north-pole-pizzeria/game.mjs
          node --check north-pole-pizzeria/browser-smoke.cjs
          node --test north-pole-pizzeria/engine.test.mjs
          python3 tools/sync-entry-points.py --check
          grep -q 'href="north-pole-pizzeria/"' index.html
          grep -q 'href="north-pole-pizzeria/"' hub/index.html
      - name: Install Playwright browser driver
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Verify Chromium is installed
        run: which google-chrome || which chromium
      - name: Start local GameBox website
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/pizzeria-http.log 2>&1 &
          sleep 2
      - name: Play through baking, serving, shift progression on phones and desktop
        run: node north-pole-pizzeria/browser-smoke.cjs
      - name: Upload kitchen previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: north-pole-pizzeria-browser-screenshots
          path: north-pole-pizzeria/*.png
          if-no-files-found: ignore
