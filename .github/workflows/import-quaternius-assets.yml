name: Import approved Quaternius GameBox assets

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-quaternius-assets.yml"
      - "tools/import-quaternius-assets.py"
      - "tools/quaternius-import-sources.json"

permissions:
  contents: write

concurrency:
  group: quaternius-asset-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out GameBox
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check gdown==5.2.0

      - name: Configure Git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import packs in committed batches
        shell: bash
        run: |
          set -euo pipefail

          PACKS=(
            ultimate-animated-character
            ultimate-nature
            nature-crops
            ultimate-food
            ultimate-house-interior
            ultimate-animated-animals
            easy-animated-enemy
          )

          for pack in "${PACKS[@]}"; do
            echo "=== Importing $pack ==="
            python tools/import-quaternius-assets.py --pack "$pack" --workers 6

            git add "shared/asset-pool/quaternius/$pack" shared/asset-pool/manifest.json

            if git diff --cached --quiet; then
              echo "No changes for $pack"
              continue
            fi

            git commit -m "Import Quaternius $pack asset pack"
            git pull --rebase origin main
            git push origin HEAD:main
          done

      - name: Verify complete asset pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("shared/asset-pool/manifest.json").read_text())
          assert manifest["complete"], (
              f"Asset pool incomplete: {manifest['totalAssets']}/"
              f"{manifest['expectedTotalAssets']}"
          )
          assert manifest["totalAssets"] == 548
          print("Verified 548 GameBox Quaternius assets.")
          PY
