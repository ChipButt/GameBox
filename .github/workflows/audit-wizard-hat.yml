name: Audit Wizard Hat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-wizard-hat.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare Elf/Wizard material bounds
        shell: bash
        run: |
          python - <<'PY'
          import base64,json,pathlib,struct
          COMP={5126:("f",4),5125:("I",4),5123:("H",2),5122:("h",2),5121:("B",1),5120:("b",1)}
          WIDTH={"SCALAR":1,"VEC2":2,"VEC3":3,"VEC4":4}
          def acc(doc,idx):
              a=doc["accessors"][idx];v=doc["bufferViews"][a["bufferView"]]
              raw=base64.b64decode(doc["buffers"][v["buffer"]]["uri"].split(",",1)[1])
              fmt,size=COMP[a["componentType"]];n=WIDTH[a["type"]]
              stride=v.get("byteStride",n*size);start=v.get("byteOffset",0)+a.get("byteOffset",0)
              return [struct.unpack_from("<"+fmt*n,raw,start+i*stride) for i in range(a["count"])]
          for donor in ("BaseCharacter","Elf","Wizard","Witch"):
              doc=json.loads((pathlib.Path("shared/asset-pool/quaternius/ultimate-animated-character")/(donor+".gltf")).read_text())
              mats=doc.get("materials",[])
              print("DONOR",donor)
              by={}
              for mesh in doc.get("meshes",[]):
                  for prim in mesh.get("primitives",[]):
                      mi=prim.get("material",-1);name=mats[mi].get("name","") if 0<=mi<len(mats) else ""
                      pos=acc(doc,prim["attributes"]["POSITION"])
                      idx=[int(x[0]) for x in acc(doc,prim["indices"])] if "indices" in prim else list(range(len(pos)))
                      pts=[pos[v] for v in set(idx)]
                      if not pts:continue
                      xs=[p[0] for p in pts];ys=[p[1] for p in pts];zs=[p[2] for p in pts]
                      rec=by.setdefault(name,{"tri":0,"minx":1e9,"maxx":-1e9,"miny":1e9,"maxy":-1e9,"minz":1e9,"maxz":-1e9})
                      rec["tri"]+=len(idx)//3
                      rec["minx"]=min(rec["minx"],min(xs));rec["maxx"]=max(rec["maxx"],max(xs))
                      rec["miny"]=min(rec["miny"],min(ys));rec["maxy"]=max(rec["maxy"],max(ys))
                      rec["minz"]=min(rec["minz"],min(zs));rec["maxz"]=max(rec["maxz"],max(zs))
              for name,rec in by.items():
                  print("BOUNDS",name,"tri",rec["tri"],"xyz",[round(rec[k],3) for k in ("minx","maxx","miny","maxy","minz","maxz")])
          PY

# rerun marker
