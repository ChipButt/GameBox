name: Audit Wizard Hat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-wizard-hat.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Elf and Wizard hat materials
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, pathlib, struct
          COMP={5126:("f",4),5125:("I",4),5123:("H",2),5122:("h",2),5121:("B",1),5120:("b",1)}
          WIDTH={"SCALAR":1,"VEC2":2,"VEC3":3,"VEC4":4}
          HEAD={"Head","Neck"}

          def accessor(doc,idx):
              a=doc["accessors"][idx]; v=doc["bufferViews"][a["bufferView"]]
              raw=base64.b64decode(doc["buffers"][v["buffer"]]["uri"].split(",",1)[1])
              fmt,size=COMP[a["componentType"]]; width=WIDTH[a["type"]]
              stride=v.get("byteStride",width*size); start=v.get("byteOffset",0)+a.get("byteOffset",0)
              return [struct.unpack_from("<"+fmt*width,raw,start+i*stride) for i in range(a["count"])]

          for donor in ("Elf","Wizard"):
              p=pathlib.Path("shared/asset-pool/quaternius/ultimate-animated-character")/(donor+".gltf")
              doc=json.loads(p.read_text())
              mats=doc.get("materials",[])
              nodes=doc.get("nodes",[])
              bones=[nodes[i].get("name","") for i in doc["skins"][0]["joints"]]
              print("DONOR",donor)
              for i,m in enumerate(mats):
                  print("MAT",i,m.get("name"),m.get("pbrMetallicRoughness",{}).get("baseColorFactor"))
              all_pos=[]
              for mesh in doc.get("meshes",[]):
                  for prim in mesh.get("primitives",[]):
                      pos=accessor(doc,prim["attributes"]["POSITION"])
                      all_pos.extend(p[1] for p in pos)
              ymin,ymax=min(all_pos),max(all_pos); yr=max(1e-9,ymax-ymin)
              for mesh in doc.get("meshes",[]):
                  for pi,prim in enumerate(mesh.get("primitives",[])):
                      mi=prim.get("material",-1)
                      name=mats[mi].get("name","") if 0<=mi<len(mats) else ""
                      if name!="Gold": continue
                      pos=accessor(doc,prim["attributes"]["POSITION"])
                      joints=accessor(doc,prim["attributes"]["JOINTS_0"])
                      weights=accessor(doc,prim["attributes"]["WEIGHTS_0"])
                      idx=[int(x[0]) for x in accessor(doc,prim["indices"])] if "indices" in prim else list(range(len(pos)))
                      stats=[]
                      for t in range(0,len(idx)-2,3):
                          tri=idx[t:t+3]
                          meanY=sum(pos[v][1] for v in tri)/3
                          y=(meanY-ymin)/yr
                          h=0
                          maxh=0
                          for v in tri:
                              vh=0
                              for ji,w in zip(joints[v],weights[v]):
                                  if bones[int(ji)] in HEAD: vh+=float(w)
                              h+=vh; maxh=max(maxh,vh)
                          stats.append((y,h,maxh))
                      print("GOLD_TRIANGLES",len(stats))
                      if stats:
                          print("GOLD_Y_RANGE",round(min(s[0] for s in stats),4),round(max(s[0] for s in stats),4))
                          print("GOLD_HEAD_SCORE_RANGE",round(min(s[1] for s in stats),4),round(max(s[1] for s in stats),4))
                          bins=[(0.50,0.60),(0.60,0.70),(0.70,0.80),(0.80,0.90),(0.90,1.01)]
                          for lo,hi in bins:
                              vals=[s for s in stats if lo<=s[0]<hi]
                              if vals: print("BIN",lo,hi,"count",len(vals),"avgHead",round(sum(s[1] for s in vals)/len(vals),4),"maxHead",round(max(s[1] for s in vals),4))
          PY
