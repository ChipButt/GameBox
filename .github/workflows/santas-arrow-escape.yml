name: Santa's Arrow Escape mobile checks
on:
  push:
    paths:
      - 'santas-arrow-escape/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/santas-arrow-escape.yml'
  pull_request:
    paths:
      - 'santas-arrow-escape/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/santas-arrow-escape.yml'
  workflow_dispatch:
jobs:
  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all 40 puzzles and script syntax
        run: |
          node --check santas-arrow-escape/engine.mjs
          node --check santas-arrow-escape/game.mjs
          node --check santas-arrow-escape/browser-smoke.cjs
          node --test santas-arrow-escape/engine.test.mjs
          python3 tools/sync-entry-points.py --check
          grep -q 'href="santas-arrow-escape/"' index.html
          grep -q 'href="santas-arrow-escape/"' hub/index.html
      - name: Install browser automation
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Verify Chromium available
        run: which google-chrome || which chromium
      - name: Start local GameBox server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/santa-arrows-http.log 2>&1 &
          sleep 2
      - name: Play on three phone viewports
        run: node santas-arrow-escape/browser-smoke.cjs
      - name: Upload game screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: santa-arrows-mobile
          path: santas-arrow-escape/*.png
          if-no-files-found: ignore
