name: Snowball Knockdown mobile checks
on:
  push:
    paths:
      - 'snowball-knockdown/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/snowball-knockdown.yml'
  pull_request:
    paths:
      - 'snowball-knockdown/**'
      - 'index.html'
      - 'hub/index.html'
      - '.github/workflows/snowball-knockdown.yml'
  workflow_dispatch:
jobs:
  test-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate scripts and game engine
        run: |
          node --check snowball-knockdown/engine.js
          node --check snowball-knockdown/game.js
          node --check snowball-knockdown/browser-smoke.cjs
          node --test snowball-knockdown/engine.test.cjs
          python3 tools/sync-entry-points.py --check
      - name: Confirm GameBox catalogue entry
        run: |
          grep -q 'href="snowball-knockdown/"' index.html
          grep -q 'href="snowball-knockdown/"' hub/index.html
      - name: Install browser automation
        run: npm install --no-save --no-package-lock playwright-core@1.56.1
      - name: Verify Chromium available
        run: which google-chrome || which chromium
      - name: Start test server
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/snowball-http.log 2>&1 &
          sleep 2
      - name: Verify two mobile viewports and real gameplay
        run: node snowball-knockdown/browser-smoke.cjs
      - name: Upload verification screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snowball-knockdown-mobile
          path: snowball-knockdown/*.png
          if-no-files-found: ignore
