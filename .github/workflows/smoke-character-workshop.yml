name: Smoke Test Character Workshop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - character-playground/**
      - assets/gamebox/wearables/footwear/**
      - .github/workflows/smoke-character-workshop.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install chromium --with-deps >/dev/null

      - name: Run Character Workshop smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/gamebox-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > .character-workshop-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/character-playground/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#partSourceGrid .partSourceCard',{timeout:120000});
          await page.waitForFunction(()=>document.querySelector('#loading')?.style.display==='none',{timeout:120000});

          const category = async (id) => {
            const back=page.locator('#backToCategoriesBtn:visible');
            if(await back.count()) {
              await back.click();
              await page.waitForTimeout(80);
            }
            await page.click('.partCategoryBtn[data-part="'+id+'"]');
            await page.waitForTimeout(250);
            return await page.locator('#partSourceGrid .partSourceCard').count();
          };

          const assert = (value,message) => { if(!value) throw new Error(message); };

          assert(await page.locator('.partCategoryBtn').count()===8,'Builder must expose exactly eight customisation category tiles.');
          assert(await page.locator('.partCategoryBtn[data-part="body"]').count()===0,'Body must not be a ninth category tile.');
          const categoryLabels=await page.locator('.categoryTileLabel').allTextContents();
          assert(JSON.stringify(categoryLabels)===JSON.stringify(['FACE','HAIR','FACIAL HAIR','HEADWEAR','TOP','BOTTOM','SHOES','ACCESSORIES']),'Category tile order/labels are wrong: '+JSON.stringify(categoryLabels));
          const waitForSelected = async (optionId) => {
            await page.waitForFunction((id) => {
              const selected=document.querySelector('[data-option="'+id+'"].selected');
              const loadError=document.querySelector('#loadError:not([hidden])');
              return Boolean(selected || loadError);
            },optionId,{timeout:15000});
            const errorText=await page.locator('#loadError:not([hidden])').allTextContents();
            if(errorText.length) throw new Error(optionId+' failed to load: '+errorText.join(' '));
            assert(await page.locator('[data-option="'+optionId+'"].selected').count()===1,optionId+' did not become active.');
          };

          const headCount=await category('head');
          assert(headCount===8,'Head catalogue should contain only 8 visibly distinct head choices.');
          assert(await page.locator('#partSourceGrid .partColourSwatches b').count()>=8,'Head options are missing authored base-colour swatches.');

          await page.click('[data-option="head-06"]');
          await waitForSelected('head-06');
          const headDiag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts.head);
          assert(headDiag?.sourceId==='Elf','Elf head did not load from the Elf donor.');
          assert(headDiag.materialNames.includes('Skin') && headDiag.materialNames.includes('Face'),'Elf head is missing real head/face materials.');
          assert(!headDiag.materialNames.some(name=>/hat|helmet|horn/i.test(name)),'Hat or helmet geometry leaked into the Head slot.');
          const headArmWeights=Object.entries(headDiag.boneWeightMaxima).filter(([name,weight])=>/Shoulder|UpperArm|LowerArm|Fist/i.test(name) && weight>=0.08);
          assert(headArmWeights.length===0,'Meaningful arm/hand weights leaked into the Head slot: '+JSON.stringify(headArmWeights));

          const headOptionIds=await page.locator('.partCategoryBtn[data-part="head"]').count()
            ? ["head-01","head-06","head-07","head-08","head-03","head-14","head-17","head-18"]
            : [];
          const headFingerprints=[];
          for (const optionId of headOptionIds) {
            await category('head');
            await page.click('[data-option="'+optionId+'"]');
            await waitForSelected(optionId);
            const diag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts.head);
            const armWeights=Object.entries(diag.boneWeightMaxima).filter(([name,weight])=>/Shoulder|UpperArm|LowerArm|Fist/i.test(name) && weight>=0.08);
            assert(armWeights.length===0,optionId+' contains meaningful arm/hand weighted geometry: '+JSON.stringify(armWeights));
            assert(diag.geometryFingerprint,optionId+' loaded no measurable head geometry.');
            headFingerprints.push([optionId,diag.geometryFingerprint]);
          }
          assert(new Set(headFingerprints.map(([,fingerprint])=>fingerprint)).size===8,'Two or more retained head buttons still load identical geometry: '+JSON.stringify(headFingerprints));

          await category('head');
          await page.click('[data-option="head-08"]');
          await waitForSelected('head-08');
          const teethRow=page.locator('#componentColourList .componentMaterialRow').filter({hasText:/Teeth/i});
          assert(await teethRow.count()>=1,'Goblin head does not expose Teeth as a removable feature.');
          const teethToggle=teethRow.first().locator('.materialVisibility');
          await teethToggle.click();
          let goblinHidden=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts.head.materialVisibility);
          const teethEntries=Object.entries(goblinHidden).filter(([name])=>/teeth/i.test(name));
          assert(teethEntries.length>=1 && teethEntries.every(([,visible])=>visible===false),'Goblin Teeth were not fully hidden.');


          await category('headwear');
          await page.click('[data-option="headwear-elf"]');
          await waitForSelected('headwear-elf');
          const wizardHatDiag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts.headwear);
          assert(wizardHatDiag.materialNames.includes('Hat'),'Elf/Wizard headwear is missing Hat geometry.');
          assert(wizardHatDiag.materialNames.includes('Gold'),'Elf/Wizard hat band/Gold trim is missing from Headwear.');
          assert(!wizardHatDiag.materialNames.includes('Skin'),'Skin geometry leaked into the Elf/Wizard hat.');
          assert(await page.locator('#componentColourList .componentMaterialRow').filter({hasText:/Band \/ Gold trim/i}).count()>=1,'Wizard hat band does not have its own colour control.');

          const hairCount=await category('hair');
          assert(hairCount===24,'Hair should contain 23 head-hair styles plus None.');
          assert(await page.locator('[data-option="hair-moustache"]').count()===0,'Moustache is still incorrectly in Hair.');
          assert((await page.locator('#partSourceGrid .partSourceCard strong').allTextContents()).every(label=>!label.includes('Viking Hair · Helmet')),'Viking helmet hair is still exposed as a hairstyle.');

          await page.click('[data-option="hair-casual-f"]');
          await waitForSelected('hair-casual-f');

          const facialHairCount=await category('facialHair');
          assert(facialHairCount===2,'Facial Hair should contain Moustache plus None.');
          assert(await page.locator('[data-option="facialhair-moustache"]').count()===1,'Moustache is missing from Facial Hair.');
          await page.click('[data-option="facialhair-moustache"]');
          await waitForSelected('facialhair-moustache');
          let simultaneous=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts);
          assert(simultaneous.hair.optionId==='hair-casual-f' && simultaneous.hair.visible,'Head hair was lost when facial hair was selected.');
          assert(simultaneous.facialHair.optionId==='facialhair-moustache' && simultaneous.facialHair.visible,'Facial hair was not active alongside head hair.');

          const headwearCount=await category('headwear');
          assert(headwearCount===9,'Headwear should contain 8 actual styles plus None.');
          await page.click('[data-option="headwear-viking"]');
          await waitForSelected('headwear-viking');
          let withHelmet=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts);
          assert(withHelmet.hair.optionId==='hair-casual-f','Helmet changed the saved hairstyle instead of preserving it.');
          assert(withHelmet.hair.visible===false,'Viking Helmet should temporarily hide incompatible hair.');
          assert(withHelmet.facialHair.optionId==='facialhair-moustache' && withHelmet.facialHair.visible,'Helmet incorrectly removed facial hair.');
          await page.locator('#partSourceGrid .noneCard').click();
          await page.waitForTimeout(150);
          let withoutHelmet=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts);
          assert(withoutHelmet.headwear.optionId===null,'Headwear None did not remove the helmet.');
          assert(withoutHelmet.hair.optionId==='hair-casual-f' && withoutHelmet.hair.visible===true,'Removing headwear did not restore the previously selected hairstyle.');

          const topCount=await category('top');
          assert(topCount===22,'Top/body catalogue should contain 22 curated clothing/body options.');

          const bottomCount=await category('bottom');
          assert(bottomCount===22,'Bottom/legs catalogue should contain 22 curated options.');

          const shoeCount=await category('shoes');
          assert(shoeCount===2,'Shoes must contain exactly the two hand-built custom footwear assets.');
          assert(await page.locator('[data-option="wearable-regular-shoes"]').count()===1,'Regular Shoes wearable missing.');
          assert(await page.locator('[data-option="wearable-traditional-elf-shoes"]').count()===1,'Traditional Elf Shoes wearable missing.');
          const shoeLabels=(await page.locator('#partSourceGrid .partSourceCard strong').allTextContents()).sort();
          assert(JSON.stringify(shoeLabels)===JSON.stringify(['Regular Shoes','Traditional Elf Shoes'].sort()),'Unexpected source-character shoes leaked into the Shoes catalogue.');

          for (const optionId of ['wearable-regular-shoes','wearable-traditional-elf-shoes']) {
            await page.click('[data-option="'+optionId+'"]');
            await waitForSelected(optionId);
            const diag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__?.snapshot?.());
            assert(diag?.shoes?.directSkeletonBinding===true,optionId+' is not using direct skeleton binding.');
            assert(diag?.shoes?.usesDriverSkeleton===true,optionId+' is not bound to the live driver skeleton.');
            assert(diag?.shoes?.skinnedMeshCount>=1,optionId+' contains no active skinned shoe mesh.');
          }

          await page.click('.tabBtn[data-tab="pose"]');
          const poseButtons=page.locator('.poseBtn');
          const poseNames=await poseButtons.allTextContents();
          const walkIndex=poseNames.findIndex(name=>/walk/i.test(name));
          assert(walkIndex>=0,'No Walk animation is available for footwear validation.');
          await poseButtons.nth(walkIndex).click();
          await page.waitForTimeout(120);
          const bonesA=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().shoes.weightedBoneMatrices);
          await page.waitForTimeout(520);
          const animatedDiag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot());
          const bonesB=animatedDiag.shoes.weightedBoneMatrices;
          assert(/walk/i.test(animatedDiag.pose),'Walk animation did not become active.');
          assert(Object.keys(bonesA).length>0,'Custom footwear exposes no weighted driver bones.');
          assert(JSON.stringify(bonesA)!==JSON.stringify(bonesB),'Walk animation did not move any bone that actually weights the custom footwear.');
          assert(animatedDiag.shoes.directSkeletonBinding && animatedDiag.shoes.usesDriverSkeleton,'Custom footwear lost its live skeleton binding during animation.');

          await page.click('.tabBtn[data-tab="style"]');
          await page.waitForTimeout(100);
          assert(await page.locator('#proportionPanel:not([hidden])').count()===1,'Body proportion controls should remain available without becoming a ninth category.');
          await category('head');
          await page.waitForTimeout(100);
          assert(await page.locator('#componentColourList .componentMaterialRow').count()>=1,'Face component did not expose its local colour editor.');
          await page.locator('#heightSlider').evaluate(el=>{el.value='106';el.dispatchEvent(new Event('input',{bubbles:true}));});
          assert((await page.textContent('#heightValue')).includes('106'),'Height slider did not update.');

          const mobileViewports=[
            {width:360,height:740},
            {width:375,height:812},
            {width:390,height:844},
            {width:393,height:852},
            {width:430,height:932}
          ];
          for (const viewport of mobileViewports) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(320);
            await category('top');
            await page.waitForTimeout(100);

            const cardRects=await page.locator('#partSourceGrid .partSourceCard').evaluateAll(cards=>cards.slice(0,9).map(card=>{
              const r=card.getBoundingClientRect();
              return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};
            }));
            assert(cardRects.length>=9,'Mobile selector did not render enough top/body option cards at '+viewport.width+'x'+viewport.height+'.');
            for(let i=0;i<cardRects.length;i++){
              assert(cardRects[i].width>70 && cardRects[i].height>80,'Mobile selector card collapsed at '+viewport.width+'x'+viewport.height+'.');
              for(let j=i+1;j<cardRects.length;j++){
                const a=cardRects[i],b=cardRects[j];
                const overlaps=!(a.right<=b.left+1 || b.right<=a.left+1 || a.bottom<=b.top+1 || b.bottom<=a.top+1);
                assert(!overlaps,'Selector cards overlap at '+viewport.width+'x'+viewport.height+'.');
              }
            }

            const framing=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot());
            const layout=framing.characterScreenBounds;
            const visible=framing.visibleCharacterArea;
            assert(layout && visible,'Could not measure adaptive character framing at '+viewport.width+'x'+viewport.height+'.');
            assert(layout.bottom <= visible.bottom + 2,'Character feet are below the safe visible area at '+viewport.width+'x'+viewport.height+'. bottom='+layout.bottom.toFixed(1)+' safeBottom='+visible.bottom.toFixed(1));
            assert(layout.top >= visible.top - 8,'Character head is cropped above the safe visible area at '+viewport.width+'x'+viewport.height+'. top='+layout.top.toFixed(1)+' safeTop='+visible.top.toFixed(1));
          }

          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          console.log('Character Workshop browser smoke test passed.');
          JS

          node .character-workshop-smoke.mjs
