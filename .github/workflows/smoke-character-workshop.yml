name: Smoke Test Character Workshop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - character-playground/**
      - assets/gamebox/wearables/footwear/**
      - .github/workflows/smoke-character-workshop.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install chromium --with-deps >/dev/null

      - name: Run Character Workshop smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/gamebox-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > .character-workshop-smoke.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1280,height:900}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/character-playground/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForSelector('#partSourceGrid .partSourceCard',{timeout:120000});
          await page.waitForFunction(()=>document.querySelector('#loading')?.style.display==='none',{timeout:120000});

          const category = async (id) => {
            await page.click('.partCategoryBtn[data-part="'+id+'"]');
            await page.waitForTimeout(250);
            return await page.locator('#partSourceGrid .partSourceCard').count();
          };

          const assert = (value,message) => { if(!value) throw new Error(message); };
          const waitForSelected = async (optionId) => {
            await page.waitForFunction((id) => {
              const selected=document.querySelector('[data-option="'+id+'"].selected');
              const loadError=document.querySelector('#loadError:not([hidden])');
              return Boolean(selected || loadError);
            },optionId,{timeout:15000});
            const errorText=await page.locator('#loadError:not([hidden])').allTextContents();
            if(errorText.length) throw new Error(optionId+' failed to load: '+errorText.join(' '));
            assert(await page.locator('[data-option="'+optionId+'"].selected').count()===1,optionId+' did not become active.');
          };

          const headCount=await category('head');
          assert(headCount===14,'Head catalogue should contain only the 14 complete, deduplicated heads.');
          assert(await page.locator('#partSourceGrid .partColourSwatches b').count()>=14,'Head options are missing authored base-colour swatches.');

          await page.click('[data-option="head-elf"]');
          await waitForSelected('head-elf');
          const headDiag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().parts.head);
          assert(headDiag?.sourceId==='Elf','Elf head did not load from the Elf donor.');
          assert(headDiag.materialNames.includes('Skin') && headDiag.materialNames.includes('Face'),'Elf head is missing real head/face materials.');
          assert(!headDiag.materialNames.some(name=>/hat|helmet|horn/i.test(name)),'Hat or helmet geometry leaked into the Head slot.');

          const hairCount=await category('hair');
          assert(hairCount===26,'Hair catalogue should contain 25 labelled styles plus None.');

          const headwearCount=await category('headwear');
          assert(headwearCount===9,'Headwear should contain 8 actual styles plus None.');

          const topCount=await category('top');
          assert(topCount===22,'Top/body catalogue should contain 22 curated clothing/body options.');

          const bottomCount=await category('bottom');
          assert(bottomCount===22,'Bottom/legs catalogue should contain 22 curated options.');

          const shoeCount=await category('shoes');
          assert(shoeCount===2,'Shoes must contain exactly the two hand-built custom footwear assets.');
          assert(await page.locator('[data-option="wearable-regular-shoes"]').count()===1,'Regular Shoes wearable missing.');
          assert(await page.locator('[data-option="wearable-traditional-elf-shoes"]').count()===1,'Traditional Elf Shoes wearable missing.');
          const shoeLabels=(await page.locator('#partSourceGrid .partSourceCard strong').allTextContents()).sort();
          assert(JSON.stringify(shoeLabels)===JSON.stringify(['Regular Shoes','Traditional Elf Shoes'].sort()),'Unexpected source-character shoes leaked into the Shoes catalogue.');

          for (const optionId of ['wearable-regular-shoes','wearable-traditional-elf-shoes']) {
            await page.click('[data-option="'+optionId+'"]');
            await waitForSelected(optionId);
            const diag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__?.snapshot?.());
            assert(diag?.shoes?.directSkeletonBinding===true,optionId+' is not using direct skeleton binding.');
            assert(diag?.shoes?.usesDriverSkeleton===true,optionId+' is not bound to the live driver skeleton.');
            assert(diag?.shoes?.skinnedMeshCount>=1,optionId+' contains no active skinned shoe mesh.');
          }

          await page.click('.tabBtn[data-tab="pose"]');
          const poseButtons=page.locator('.poseBtn');
          const poseNames=await poseButtons.allTextContents();
          const walkIndex=poseNames.findIndex(name=>/walk/i.test(name));
          assert(walkIndex>=0,'No Walk animation is available for footwear validation.');
          await poseButtons.nth(walkIndex).click();
          await page.waitForTimeout(120);
          const bonesA=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().shoes.weightedBoneMatrices);
          await page.waitForTimeout(520);
          const animatedDiag=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot());
          const bonesB=animatedDiag.shoes.weightedBoneMatrices;
          assert(/walk/i.test(animatedDiag.pose),'Walk animation did not become active.');
          assert(Object.keys(bonesA).length>0,'Custom footwear exposes no weighted driver bones.');
          assert(JSON.stringify(bonesA)!==JSON.stringify(bonesB),'Walk animation did not move any bone that actually weights the custom footwear.');
          assert(animatedDiag.shoes.directSkeletonBinding && animatedDiag.shoes.usesDriverSkeleton,'Custom footwear lost its live skeleton binding during animation.');

          await page.click('.partCategoryBtn[data-part="body"]');
          await page.waitForTimeout(150);
          assert(await page.locator('#proportionPanel:not([hidden])').count()===1,'Body proportion panel did not open.');
          await page.locator('#heightSlider').evaluate(el=>{el.value='106';el.dispatchEvent(new Event('input',{bubbles:true}));});
          assert((await page.textContent('#heightValue')).includes('106'),'Height slider did not update.');

          await page.setViewportSize({width:390,height:844});
          await page.waitForTimeout(250);
          await page.click('.partCategoryBtn[data-part="top"]');
          await page.waitForTimeout(100);

          const cardRects=await page.locator('#partSourceGrid .partSourceCard').evaluateAll(cards=>cards.slice(0,9).map(card=>{
            const r=card.getBoundingClientRect();
            return {left:r.left,right:r.right,top:r.top,bottom:r.bottom,width:r.width,height:r.height};
          }));
          assert(cardRects.length>=9,'Mobile selector did not render enough top/body option cards.');
          for(let i=0;i<cardRects.length;i++){
            assert(cardRects[i].width>70 && cardRects[i].height>80,'Mobile selector card collapsed.');
            for(let j=i+1;j<cardRects.length;j++){
              const a=cardRects[i],b=cardRects[j];
              const overlaps=!(a.right<=b.left+1 || b.right<=a.left+1 || a.bottom<=b.top+1 || b.bottom<=a.top+1);
              assert(!overlaps,'Selector cards overlap on mobile.');
            }
          }

          const layout=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__.snapshot().characterScreenBounds);
          const builderBox=await page.locator('#builder').boundingBox();
          assert(layout && builderBox,'Could not measure mobile Character Workshop layout.');
          assert(layout.bottom <= builderBox.y - 8,'Character legs or feet are hidden behind the mobile selector. characterBottom='+layout.bottom.toFixed(1)+' selectorTop='+builderBox.y.toFixed(1));

          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          console.log('Character Workshop browser smoke test passed.');
          JS

          node .character-workshop-smoke.mjs
