name: Import Workshop Watch Objective Art

on:
  push:
    paths:
      - '.github/workflows/import-workshop-watch-objective.yml'

permissions:
  contents: write

jobs:
  import-objective:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download Gherwit City Tiles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ww-objective
          cd /tmp
          npm init -y >/dev/null 2>&1
          npm install itchio-downloader >/dev/null 2>&1

          cat > /tmp/download-objective.cjs <<'NODE'
          const {downloadGame}=require('/tmp/node_modules/itchio-downloader');
          (async()=>{
            const r=await downloadGame({
              itchGameUrl:'https://gherwit.itch.io/city-tiles',
              downloadDirectory:'/tmp/ww-objective',
              desiredFileName:'gherwit-city-tiles',
              writeMetaData:false,
              retries:2
            });
            console.log(JSON.stringify(r,null,2));
            if(!r.status) throw new Error(r.message||'download failed');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/download-objective.cjs
          find /tmp/ww-objective -type f -maxdepth 3 -print

      - name: Import objective art
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p workshop-watch/assets/vendor/gherwit/city

          python3 - <<'PY'
          import os, glob, zipfile, shutil
          files=[p for p in glob.glob('/tmp/ww-objective/**/*',recursive=True) if os.path.isfile(p)]
          if not files:
              raise SystemExit('No City Tiles download found')

          copied=0
          for src in files:
              low=src.lower()
              if low.endswith('.zip'):
                  with zipfile.ZipFile(src) as z:
                      for info in z.infolist():
                          if info.is_dir() or not info.filename.lower().endswith(('.png','.txt','.md')):
                              continue
                          rel=os.path.normpath(info.filename).replace('\\','/')
                          while rel.startswith('../'):
                              rel=rel[3:]
                          out=os.path.join('workshop-watch/assets/vendor/gherwit/city',rel)
                          os.makedirs(os.path.dirname(out),exist_ok=True)
                          with z.open(info) as rf, open(out,'wb') as wf:
                              shutil.copyfileobj(rf,wf)
                          copied+=1
              elif low.endswith(('.png','.txt','.md')):
                  out=os.path.join('workshop-watch/assets/vendor/gherwit/city',os.path.basename(src))
                  shutil.copy2(src,out)
                  copied+=1

          if copied==0:
              raise SystemExit('Downloaded City Tiles contained no importable PNG/text files')
          print('Imported',copied,'files')
          PY

          if ! grep -q "CITY TILES" workshop-watch/assets/CREDITS.md; then
            cat >> workshop-watch/assets/CREDITS.md <<'EOF'

## Gherwit — City Tiles
- CITY TILES: https://gherwit.itch.io/city-tiles
- Used only for the Workshop Watch protected workshop/objective so the building remains in the same Gherwit 16×16 top-down pixel family.
EOF
          fi

          find workshop-watch/assets/vendor/gherwit/city -type f -print | sort

      - name: Commit imported objective art and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workshop-watch/assets/vendor/gherwit/city workshop-watch/assets/CREDITS.md
          git rm .github/workflows/import-workshop-watch-objective.yml
          git commit -m "Import Gherwit objective art for Workshop Watch"
          git pull --rebase origin main
          git push origin main
