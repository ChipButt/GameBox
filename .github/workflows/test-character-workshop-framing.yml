name: Test Character Workshop Framing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - character-playground/game.js
      - character-playground/index.html
      - character-playground/style.css
      - .github/workflows/test-character-workshop-framing.yml

permissions:
  contents: read

jobs:
  framing:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser test tools
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install chromium --with-deps >/dev/null
      - name: Verify full-body framing
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 >/tmp/gamebox-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1

          cat > .framing-test.mjs <<'JS'
          import { chromium } from 'playwright';

          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844}});
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e)));
          page.on('console',m=>{ if(m.type()==='error') errors.push(m.text()); });

          await page.goto('http://127.0.0.1:4173/character-playground/',{waitUntil:'networkidle',timeout:120000});
          await page.waitForFunction(()=>document.querySelector('#loading')?.style.display==='none',{timeout:120000});

          const sizes=[
            {width:360,height:740},
            {width:375,height:812},
            {width:390,height:844},
            {width:393,height:852},
            {width:430,height:932}
          ];

          for (const viewport of sizes) {
            await page.setViewportSize(viewport);
            await page.waitForTimeout(500);
            const data=await page.evaluate(()=>window.__GAMEBOX_CHARACTER_WORKSHOP__?.snapshot?.());
            if(!data?.characterScreenBounds || !data?.visibleCharacterArea) throw new Error('Missing framing diagnostics at '+viewport.width+'x'+viewport.height);
            const b=data.characterScreenBounds;
            const a=data.visibleCharacterArea;
            if(b.bottom > a.bottom + 2) throw new Error('Feet obscured at '+viewport.width+'x'+viewport.height+': bottom='+b.bottom.toFixed(1)+' safeBottom='+a.bottom.toFixed(1));
            if(b.top < a.top - 8) throw new Error('Head cropped at '+viewport.width+'x'+viewport.height+': top='+b.top.toFixed(1)+' safeTop='+a.top.toFixed(1));
            const builder=await page.locator('#builder').boundingBox();
            if(builder && b.bottom > builder.y - 16) throw new Error('Feet too close to selector at '+viewport.width+'x'+viewport.height+': bottom='+b.bottom.toFixed(1)+' selectorTop='+builder.y.toFixed(1));
            console.log('FRAMING_OK',viewport.width+'x'+viewport.height,JSON.stringify({character:b,safe:a,builderTop:builder?.y}));
          }

          if(errors.length) throw new Error('Browser errors: '+errors.join(' | '));
          await browser.close();
          JS

          node .framing-test.mjs
