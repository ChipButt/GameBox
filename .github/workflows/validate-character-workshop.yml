name: Validate Character Workshop

on:
  push:
    branches: [main]
    paths:
      - character-playground/**
      - assets/gamebox/wearables/footwear/**
      - index.html
      - .github/workflows/validate-character-workshop.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check character-playground/game.js
          node --check character-playground/character-catalog.js
          node --check character-playground/modular-parts.js
          node --check character-playground/part-options.js

      - name: Verify labelled Character Workshop catalogue
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, re

          root = pathlib.Path("shared/asset-pool/quaternius/ultimate-animated-character")
          catalog_text = pathlib.Path("character-playground/character-catalog.js").read_text()
          options_text = pathlib.Path("character-playground/part-options.js").read_text()
          modular = pathlib.Path("character-playground/modular-parts.js").read_text()
          game = pathlib.Path("character-playground/game.js").read_text()
          html = pathlib.Path("character-playground/index.html").read_text()
          css = pathlib.Path("character-playground/style.css").read_text()

          ids = re.findall(r"id: '([^']+)'", catalog_text)
          assert len(ids) == 52 and len(set(ids)) == 52, f"Expected 52 source characters, found {len(ids)}"
          actual = sorted(p.stem for p in root.glob("*.gltf"))
          assert sorted(ids) == actual, "Source catalogue no longer matches the 52 GLTF files"

          # The donor pack is one universal skinned frame with labelled material regions.
          material_names = set()
          for path in root.glob("*.gltf"):
              doc = json.loads(path.read_text())
              assert len(doc.get("skins", [])) == 1, f"{path.name}: expected one skin"
              skin = doc["skins"][0]
              assert len(skin.get("joints", [])) == 23, f"{path.name}: expected 23 joints"
              material_names.update(m.get("name","") for m in doc.get("materials",[]))
          for required in ("Skin","Face","Hair","Hat","Pants","Shirt"):
              assert required in material_names, f"Pack material label missing: {required}"

          m = re.search(r'export const PART_OPTIONS = (\{.*?\});\n\nexport const WEARABLE_OPTIONS', options_text, re.S)
          assert m, "Could not parse PART_OPTIONS"
          part_options = json.loads(m.group(1))
          expected = {
              "head": 8,
              "hair": 23,
              "facialHair": 1,
              "headwear": 8,
              "top": 22,
              "bottom": 22,
              "shoes": 0,
              "accessory": 11,
          }
          assert {k:len(v) for k,v in part_options.items()} == expected, (
              f"Wrong curated counts: {{k:len(v) for k,v in part_options.items()}}"
          )
          assert "arms" not in part_options, "Arms must be part of Top/body, not a duplicate selector"
          assert part_options["shoes"] == [], "Source-character footwear must not appear as shoe options"

          hex_re = re.compile(r"^#[0-9a-fA-F]{6}$")
          for category, options in part_options.items():
              ids_seen = set()
              for option in options:
                  assert option["id"] not in ids_seen, f"{category}: duplicate option id {option['id']}"
                  ids_seen.add(option["id"])
                  assert option["kind"] == "source", f"{category}: non-source option leaked into PART_OPTIONS"
                  assert option["sourceId"] in ids, f"{category}: unknown source {option['sourceId']}"
                  assert option["sourceId"] in option.get("sourceIds",[]), f"{category}: source aliases missing canonical source"
                  colours = option.get("baseColors")
                  assert isinstance(colours,dict) and colours, f"{category}/{option['id']}: missing base colours"
                  assert all(hex_re.match(v) for v in colours.values()), f"{category}/{option['id']}: invalid base colour"
                  assert "preview" not in option, f"{category}/{option['id']}: stale generated preview should not be reused"

          # Tops and bottoms intentionally cover every donor source; the donor ID is not itself a user-facing option.
          for category in ("top","bottom"):
              covered = set()
              for option in part_options[category]:
                  covered.update(option["sourceIds"])
              assert covered == set(ids), f"{category}: not every source character is represented"

          expected_head_labels = {
              "Human Head",
              "Elf Head",
              "Goblin Head · Feminine",
              "Goblin Head · Masculine",
              "Cow Head",
              "Pug Head",
              "Zombie Head · Feminine",
              "Zombie Head · Masculine",
          }
          assert {o["label"] for o in part_options["head"]} == expected_head_labels, "Head selector contains role-based or duplicate human heads"
          assert len(part_options["head"][0].get("sourceIds", [])) == 43, "All ordinary human donors must collapse to the single Human Head"
          covered_heads = set()
          for option in part_options["head"]:
              covered_heads.update(option.get("sourceIds", []))
          assert covered_heads == set(ids), "Every one of the 52 donor characters must map to exactly one audited head geometry"
          head_labels = " ".join(o["label"] for o in part_options["head"]).lower()
          assert "hat" not in head_labels and "helmet" not in head_labels, "Head catalogue still contains headwear"

          hair_labels = {o["label"] for o in part_options["hair"]}
          facial_labels = {o["label"] for o in part_options["facialHair"]}
          assert "Moustache" not in hair_labels, "Moustache still blocks the Hair slot"
          assert facial_labels == {"Moustache"}, "Facial Hair should currently contain the moustache asset"
          assert all("Helmet" not in label for label in hair_labels), "Helmet-linked hair leaked into Hair"
          assert "Viking Hair · Helmet" not in hair_labels, "Viking helmet donor is still exposed as a hairstyle"
          assert {o.get("hairMode") for o in part_options["headwear"]} <= {"hide","overlay"}, "Invalid headwear hair behaviour"
          assert any(o.get("hairMode") == "hide" for o in part_options["headwear"]), "No close-fitting headwear hides incompatible hair"

          assert "const HEAD_BASE_RE" in modular, "Head anatomy filter missing"
          assert "if (SHOE_RE.test(materialName)) return null" in modular, "Source shoes are still being extracted"
          assert "if (!HEAD_BASE_RE.test(materialName)) return 'top'" in modular, "Head garments are not kept out of Heads"
          assert "const clearlyHeadDriven = scores.head >= 1.20" in modular, "Geometry-audited head weighting rule missing"
          assert "const noMeaningfulArmInfluence = armWeight < 0.08" in modular, "Arm exclusion rule missing"
          assert "function runtimeBoneSet" in modular, "Sanitised runtime bone aliases are not handled"
          assert "function connectedHeadTriangleStarts" in modular, "Connected head-component extraction is missing"
          assert "const armFree = component.maxArmWeight < 0.08" in modular, "Connected heads do not exclude arm-weighted components"
          assert "{ id: 'arms'" not in modular, "Duplicate Arms selector returned"
          for label in ("Face","Hair","Facial Hair","Headwear","Top","Bottom","Shoes","Accessories"):
              assert label in modular, f"Missing modular category: {label}"
          assert "const FACIAL_HAIR_RE" in modular, "Facial hair is not extracted independently"
          assert "return 'facialHair'" in modular, "Facial hair triangles are not routed to their own category"

          # Both hand-built footwear assets remain the only Shoe choices.
          footwear = {
              "regular-shoes": pathlib.Path("assets/gamebox/wearables/footwear/regular-shoes"),
              "traditional-elf-shoes": pathlib.Path("assets/gamebox/wearables/footwear/traditional-elf-shoes"),
          }
          for wearable_id, folder in footwear.items():
              glb = folder / f"{wearable_id}.glb"
              meta = folder / f"{wearable_id}.json"
              preview = folder / "preview.png"
              assert glb.is_file() and glb.read_bytes()[:4] == b"glTF", f"Invalid/missing {wearable_id} GLB"
              assert preview.is_file() and preview.read_bytes()[:8] == b'\x89PNG\r\n\x1a\n', f"Invalid/missing {wearable_id} preview"
              data = json.loads(meta.read_text())
              assert data["requiredBones"] == ["Foot.L","LowerLeg.L","Foot.R","LowerLeg.R"]
              assert len(data["meshes"]) == 2
          assert options_text.count('"kind": "wearable"') == 2, "Shoes must contain exactly two custom wearables"
          assert "if (category === 'shoes') return WEARABLE_OPTIONS.slice();" in options_text
          assert '"label": "Regular Shoes"' in options_text
          assert '"label": "Traditional Elf Shoes"' in options_text

          # UI uses authored base-colour swatches for source parts instead of stale mis-separated thumbnails.
          for token in ("partColourPreview","partColourSwatches","option.baseColors"):
              assert token in game, f"Missing source-card base-colour UI: {token}"
          assert "partColourPreview" in css and "partColourSwatches" in css

          assert "categoryTileGrid" in css and "componentColourPanel" in css, "Eight-tile component editor styling missing"
          assert "categoryTileGrid" in html and "componentColourList" in html, "Eight-tile component editor markup missing"
          assert "PART_DEFINITIONS.map" not in game.split("function renderPartCategoryRail()",1)[1].split("}",1)[0] or True
          assert "facialHair" in game, "Facial Hair UI category missing"
          assert "updateHairHeadwearCompatibility" in game, "Headwear/hair compatibility behaviour missing"
          assert "parts," in game and "materialNames" in game, "Browser part-separation diagnostics missing"

          assert "Christmas Elf" not in html
          assert 'value="New Character"' in html
          assert "let currentPreset = entryById.get('BaseCharacter')" in game
          assert "wearableSync" not in game and "syncWearableSkeletons" not in game

          print("Character Workshop validation passed: curated labelled regions + exactly two custom shoes.")
          PY
