name: GameBox checks

on:
  push:
    branches: [main, race-manager-integration]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check lan-core.js
          node --check gamebox-v4.js
          node --check heads-v3.js
          node --check heads-lan-v2.js
          node --check heads-lan-v3.js
          node --check race-manager/app.js
          node --check race-manager/track-ui.js
      - name: Check required files
        run: |
          test -f index.html
          test -f heads.html
          test -f chipin-gamebox.css
          test -f chipin-heads.css
          test -f heads-lan-v3.js
          test -f race-manager/index.html
          test -f race-manager/styles.css
          test -f race-manager/track-ui.css
          test -f race-manager/track-ui.js
          test -f race-manager/assets/ui/logo/gridline_racing_logo.png
          test -f race-manager/assets/cars/player_gold.png
          test -f race-manager/assets/tracks/autumn_river_valley_circuit.png
          test -f race-manager/assets/tracks/forest_lake_circuit.png
          test -f race-manager/assets/tracks/desert_canyon_circuit.png
          test -f race-manager/assets/tracks/tropical_island_circuit.png
          test -f race-manager/assets/ui/hud/lap_marker_full.png
          test -f race-manager/assets/ui/hud/lap_marker_empty.png
          test -f race-manager/assets/ui/popups/leaderboard.png
