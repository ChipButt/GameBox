<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#8bc5e8">
<title>Tiny Ski Run · GameBox</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>
<main class="skiApp">
  <header class="hud">
    <a class="hudBtn homeBtn" href="../" aria-label="Back to GameBox">
      <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/home.png" alt="">
    </a>
    <div class="hudScore"><small>DISTANCE</small><strong><span id="score">0000</span>m</strong></div>
    <div class="hudBest"><small>BEST</small><strong><span id="best">0000</span>m</strong></div>
    <button id="pauseButton" class="hudBtn" type="button" aria-label="Pause game">
      <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/gear.png" alt="">
    </button>
  </header>

  <section class="gameFrame" aria-label="Tiny Ski Run game">
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    <div id="assetStatus" class="assetStatus" aria-live="polite">Loading Tiny Ski…</div>

    <section id="startOverlay" class="overlay show" aria-label="Start Tiny Ski Run">
      <div class="startCard">
        <img class="heroSkier" src="https://chipbutt.github.io/ToolBox/assets/gamebox/kenney/2d/Tiny%20Ski/Tiles/tile_0070.png" alt="">
        <p class="eyebrow">GAMEBOX</p>
        <h1>TINY SKI<br><span>RUN</span></h1>
        <p class="intro">Carve downhill. Dodge the mountain. Keep going.</p>
        <button id="startButton" class="longButton" type="button" disabled>Hit the slope</button>
        <small class="controlHint">Hold LEFT / RIGHT or use ← →</small>
      </div>
    </section>

    <section id="gameOverOverlay" class="overlay" aria-label="Game over">
      <div class="gameOverCard">
        <img class="crashSkier" src="https://chipbutt.github.io/ToolBox/assets/gamebox/kenney/2d/Tiny%20Ski/Tiles/tile_0094.png" alt="">
        <p class="eyebrow">WIPEOUT</p>
        <h2><span id="finalScore">0</span>m</h2>
        <p id="recordText">Best: 0m</p>
        <button id="againButton" class="longButton" type="button">Ski again</button>
      </div>
    </section>
  </section>

  <nav class="steerControls" aria-label="Ski controls">
    <button id="leftButton" class="steerBtn" type="button" aria-label="Steer left">
      <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/arrowLeft.png" alt="">
    </button>
    <div class="centreBadge">
      <span id="speedLabel">CRUISE</span>
      <small>HOLD TO CARVE</small>
    </div>
    <button id="rightButton" class="steerBtn right" type="button" aria-label="Steer right">
      <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/arrowLeft.png" alt="">
    </button>
  </nav>
</main>

<div id="pauseSheet" class="sheet" aria-hidden="true">
  <div class="sheetBackdrop"></div>
  <section class="sheetCard" role="dialog" aria-modal="true" aria-label="Tiny Ski Run menu">
    <div class="sheetHead">
      <strong>Run paused</strong>
      <button id="closePause" class="smallSquare" type="button" aria-label="Resume">
        <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/cross.png" alt="">
      </button>
    </div>
    <button id="resumeButton" class="menuButton" type="button">Resume</button>
    <button id="restartButton" class="menuButton" type="button">Restart run</button>
    <button id="soundButton" class="menuButton iconMenu" type="button">
      <img id="soundIcon" src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/audioOn.png" alt="">
      <span>Sound: On</span>
    </button>
    <a class="menuButton homeMenu" href="../">
      <img src="../assets/gamebox/kenney/icons/Game%20Icons/White/2x/home.png" alt="">
      <span>Back to GameBox</span>
    </a>
  </section>
</div>

<script src="game.js?v=1"></script>
</body>
</html>
