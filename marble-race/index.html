<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16212b">
<title>Marble Race · GameBox</title>
<style>
:root{font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7fbff;background:#16212b;--panel:#1d2a35;--line:#314553;--gold:#f1bd54}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#284152 0,#182630 38%,#101920 100%);overflow:hidden}body{min-height:100dvh}.app{position:relative;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));gap:8px}.hud{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;z-index:5}.home,.sound{width:44px;height:44px;border:1px solid #496171;background:linear-gradient(#2d4251,#1e2e3a);color:white;border-radius:12px;font-size:20px;box-shadow:0 4px 0 #0b1116;display:grid;place-items:center;text-decoration:none}.home:active,.sound:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1116}.title{text-align:center;min-width:0}.title strong{display:block;font-size:clamp(18px,5vw,24px);letter-spacing:.02em}.title small{display:block;color:#a9becb;font-size:11px;font-weight:800;letter-spacing:.16em}.stageWrap{position:relative;min-height:0;border:1px solid #405665;border-radius:18px;overflow:hidden;background:linear-gradient(#dce8ee,#b7cbd5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 8px 22px rgba(0,0,0,.28)}#stage{display:block;width:100%;height:100%;min-height:420px}.standings{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:3;pointer-events:none}.racerChip{min-width:0;background:rgba(13,23,30,.84);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:5px 4px;text-align:center;backdrop-filter:blur(5px)}.racerChip b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:2px solid rgba(255,255,255,.75)}.rank{font-size:10px;color:#b8cad4;font-weight:900}.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;font-size:clamp(64px,24vw,118px);font-weight:1000;color:white;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 25px rgba(255,255,255,.7);opacity:0;transform:scale(.65)}.countdown.show{animation:count .72s ease both}@keyframes count{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.35)}}.winner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:min(86%,320px);padding:18px;border:2px solid rgba(255,255,255,.82);border-radius:18px;background:rgba(15,25,33,.94);text-align:center;z-index:6;opacity:0;pointer-events:none;box-shadow:0 14px 35px rgba(0,0,0,.35)}.winner.show{animation:pop .25s ease forwards}@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.winnerBall{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;border:4px solid rgba(255,255,255,.88);box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),0 5px 12px rgba(0,0,0,.32)}.winner small{display:block;color:#afc2cf;font-weight:900;letter-spacing:.15em}.winner strong{display:block;font-size:30px;line-height:1.05;margin-top:3px}.controls{display:grid;grid-template-columns:1fr;gap:7px;z-index:5}.primary{min-height:58px;border:1px solid #f6d487;border-radius:15px;background:linear-gradient(#ffd874,#e9ad3c);color:#2d210b;font-size:19px;font-weight:1000;letter-spacing:.04em;box-shadow:0 6px 0 #96651a,0 9px 16px rgba(0,0,0,.22)}.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #96651a}.primary:disabled{filter:saturate(.35);color:#6d6251}.status{text-align:center;color:#a9becb;font-size:11px;font-weight:800;min-height:14px}.error{position:absolute;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#17242d;color:white;z-index:8}.error.show{display:grid}.error strong{display:block;font-size:20px;margin-bottom:5px}@media (max-height:650px){#stage{min-height:340px}.primary{min-height:50px}.hud{grid-template-columns:40px 1fr 40px}.home,.sound{width:40px;height:40px}}@media (prefers-reduced-motion:reduce){.countdown.show,.winner.show{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}.countdown.show{transform:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main class="app">
<header class="hud"><a class="home" href="../" aria-label="Back to GameBox">←</a><div class="title"><strong>Marble Race</strong><small>4 MARBLES · 1 WINNER</small></div><button class="sound" id="sound" type="button" aria-label="Toggle sound">♪</button></header>
<section class="stageWrap" id="stageWrap" aria-label="Marble race track">
<canvas id="stage"></canvas>
<div class="standings" id="standings" aria-live="polite"></div>
<div class="countdown" id="countdown"></div>
<div class="winner" id="winner"><div class="winnerBall" id="winnerBall"></div><small>WINNER</small><strong id="winnerText">BLUE!</strong></div>
<div class="error" id="error"><div><strong>Couldn’t start the race.</strong><span>Refresh and try again.</span></div></div>
</section>
<footer class="controls"><button class="primary" id="start" type="button" disabled>Loading track…</button><div class="status" id="status">Kenney Marble Kit course</div></footer>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as CANNON from 'https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js';

const canvas=document.getElementById('stage');
const wrap=document.getElementById('stageWrap');
const startBtn=document.getElementById('start');
const statusEl=document.getElementById('status');
const standingsEl=document.getElementById('standings');
const countdownEl=document.getElementById('countdown');
const winnerEl=document.getElementById('winner');
const winnerBall=document.getElementById('winnerBall');
const winnerText=document.getElementById('winnerText');
const soundBtn=document.getElementById('sound');
const errorEl=document.getElementById('error');

const racers=[
 {name:'Red',color:0xe84b52,css:'#e84b52'},
 {name:'Blue',color:0x3d82e7,css:'#3d82e7'},
 {name:'Green',color:0x4eb56b,css:'#4eb56b'},
 {name:'Yellow',color:0xf1c94b,css:'#f1c94b'}
];
const rampYs=[9.2,7.15,5.10,3.05,1.0,-1.05,-3.10,-5.15];
const rampAngle=0.16;
const marbleRadius=0.24;
let renderer,scene,camera,world,loader;
let trackTemplate=null,marbleTemplate=null,tunnelTemplate=null,bumpTemplate=null,bannerTemplate=null,funnelTemplate=null;
let marbleBodies=[],marbleMeshes=[],gateBody=null,gateMesh=null,finishOrder=[];
let running=false,raceStart=0,lastTime=0,soundOn=true,audioCtx=null;
let trackMaterial,marbleMaterial;

function ping(freq,duration,volume){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle';o.frequency.value=freq;g.gain.value=volume;
  o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);o.stop(audioCtx.currentTime+duration);
 }catch(e){}
}
function setStandings(){
 const order=racers.map((r,i)=>({i:i,y:marbleBodies[i]?marbleBodies[i].position.y:99,finished:finishOrder.indexOf(i)})).sort((a,b)=>{
  if(a.finished>=0&&b.finished>=0)return a.finished-b.finished;
  if(a.finished>=0)return -1;if(b.finished>=0)return 1;return a.y-b.y;
 });
 standingsEl.innerHTML='';
 order.forEach((o,rank)=>{const r=racers[o.i];const d=document.createElement('div');d.className='racerChip';d.innerHTML='<b><span class="dot" style="background:'+r.css+'"></span>'+r.name+'</b><span class="rank">'+(o.finished>=0?'FINISHED':ordinal(rank+1))+'</span>';standingsEl.appendChild(d);});
}
function ordinal(n){return n===1?'1ST':n===2?'2ND':n===3?'3RD':'4TH'}
function showCount(text){countdownEl.textContent=text;countdownEl.classList.remove('show');void countdownEl.offsetWidth;countdownEl.classList.add('show');ping(text==='GO!'?720:430,0.12,.08)}
function surfaceY(center,angle,x){return center+Math.tan(angle)*x}
function addRamp(y,angle,index){
 const body=new CANNON.Body({mass:0,material:trackMaterial});
 body.addShape(new CANNON.Box(new CANNON.Vec3(4.2,.13,1.32)),new CANNON.Vec3(0,0,0));
 body.addShape(new CANNON.Box(new CANNON.Vec3(4.2,.38,.07)),new CANNON.Vec3(0,.26,-1.29));
 body.addShape(new CANNON.Box(new CANNON.Vec3(4.2,.38,.07)),new CANNON.Vec3(0,.26,1.29));
 body.position.set(0,y,0);body.quaternion.setFromEuler(0,0,angle);world.addBody(body);
 if(trackTemplate){const model=fitModel(trackTemplate,8.45,2.65);model.position.set(0,y+.01,0);model.rotation.z=angle;scene.add(model);}
 if(index===3&&tunnelTemplate){const m=fitModel(tunnelTemplate,2.1,2.5);m.position.set(.3,y+.15,0);m.rotation.z=angle;scene.add(m);}
 if((index===2||index===5)&&bumpTemplate){const m=fitModel(bumpTemplate,1.7,2.4);m.position.set(index===2?1.1:-1.1,y+.22,0);m.rotation.z=angle;scene.add(m);}
}
function fitModel(source,targetLength,targetDepth){
 const root=new THREE.Group();const obj=source.clone(true);root.add(obj);obj.updateMatrixWorld(true);
 let box=new THREE.Box3().setFromObject(obj),size=new THREE.Vector3();box.getSize(size);
 if(size.z>size.x){obj.rotation.y=Math.PI/2;obj.updateMatrixWorld(true);box=new THREE.Box3().setFromObject(obj);box.getSize(size);}
 const scale=Math.min(targetLength/Math.max(size.x,.001),targetDepth/Math.max(size.z,.001));obj.scale.setScalar(scale);obj.updateMatrixWorld(true);
 box=new THREE.Box3().setFromObject(obj);const center=new THREE.Vector3();box.getCenter(center);obj.position.sub(center);
 obj.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;}});return root;
}
function addPeg(x,y,z){
 const body=new CANNON.Body({mass:0,material:trackMaterial,shape:new CANNON.Sphere(.32),position:new CANNON.Vec3(x,y,z||0)});world.addBody(body);
 const mesh=new THREE.Mesh(new THREE.SphereGeometry(.32,20,14),new THREE.MeshStandardMaterial({color:0xe9f0f4,roughness:.55,metalness:.05}));mesh.position.set(x,y,z||0);mesh.castShadow=true;scene.add(mesh);
}
function addGate(){
 const angle=-rampAngle,x=-2.65,y=surfaceY(rampYs[0],angle,x)+.56;
 gateBody=new CANNON.Body({mass:0,material:trackMaterial,shape:new CANNON.Box(new CANNON.Vec3(.09,.62,1.31)),position:new CANNON.Vec3(x,y,0)});world.addBody(gateBody);
 gateMesh=new THREE.Mesh(new THREE.BoxGeometry(.18,1.24,2.62),new THREE.MeshStandardMaterial({color:0xe9b840,roughness:.45}));gateMesh.position.set(x,y,0);gateMesh.castShadow=true;scene.add(gateMesh);
}
function buildWorld(){
 world=new CANNON.World({gravity:new CANNON.Vec3(0,-12.2,0)});world.broadphase=new CANNON.SAPBroadphase(world);world.allowSleep=false;
 trackMaterial=new CANNON.Material('track');marbleMaterial=new CANNON.Material('marble');
 world.addContactMaterial(new CANNON.ContactMaterial(marbleMaterial,trackMaterial,{friction:.18,restitution:.08,contactEquationStiffness:1e7}));
 world.addContactMaterial(new CANNON.ContactMaterial(marbleMaterial,marbleMaterial,{friction:.04,restitution:.34}));
 rampYs.forEach((y,i)=>addRamp(y,i%2===0?-rampAngle:rampAngle,i));
 addPeg(.35,surfaceY(rampYs[2],-rampAngle,.35)+.43,-.28);addPeg(1.05,surfaceY(rampYs[2],-rampAngle,1.05)+.43,.33);
 addPeg(-.6,surfaceY(rampYs[5],rampAngle,-.6)+.43,.28);addPeg(-1.35,surfaceY(rampYs[5],rampAngle,-1.35)+.43,-.34);
 const catchBody=new CANNON.Body({mass:0,material:trackMaterial,shape:new CANNON.Box(new CANNON.Vec3(4.5,.15,1.5)),position:new CANNON.Vec3(0,-7.25,0)});world.addBody(catchBody);
 const catchMesh=new THREE.Mesh(new THREE.BoxGeometry(9,.3,3),new THREE.MeshStandardMaterial({color:0x506979,roughness:.75}));catchMesh.position.set(0,-7.25,0);catchMesh.receiveShadow=true;scene.add(catchMesh);
 if(funnelTemplate){const f=fitModel(funnelTemplate,2.4,2.5);f.position.set(-3.55,-6.35,0);scene.add(f);}
 if(bannerTemplate){const b=fitModel(bannerTemplate,2.8,1.2);b.position.set(-3.4,-6.72,-.4);b.rotation.x=Math.PI/2;scene.add(b);}
 addGate();
}
function clearRace(){
 marbleBodies.forEach(b=>world&&world.removeBody(b));marbleBodies=[];marbleMeshes.forEach(m=>scene&&scene.remove(m));marbleMeshes=[];finishOrder=[];
 if(gateBody&&world){world.removeBody(gateBody);gateBody=null}if(gateMesh&&scene){scene.remove(gateMesh);gateMesh=null}
 winnerEl.classList.remove('show');
}
function createMarbleVisual(color){
 if(marbleTemplate){const g=fitModel(marbleTemplate,.52,.52);g.traverse(n=>{if(n.isMesh)n.material=new THREE.MeshStandardMaterial({color:color,roughness:.2,metalness:.18});});return g;}
 const g=new THREE.Mesh(new THREE.SphereGeometry(marbleRadius,28,18),new THREE.MeshStandardMaterial({color:color,roughness:.2,metalness:.18}));g.castShadow=true;return g;
}
function resetRace(){
 clearRace();addGate();const angle=-rampAngle,x=-3.45,y=surfaceY(rampYs[0],angle,x)+marbleRadius+.18;const zs=[-.72,-.24,.24,.72];
 racers.forEach((r,i)=>{const body=new CANNON.Body({mass:1,material:marbleMaterial,shape:new CANNON.Sphere(marbleRadius),linearDamping:.015,angularDamping:.01});body.position.set(x,y,zs[i]);world.addBody(body);marbleBodies.push(body);const mesh=createMarbleVisual(r.color);mesh.position.copy(body.position);scene.add(mesh);marbleMeshes.push(mesh);});
 setStandings();startBtn.disabled=false;startBtn.textContent='START RACE';statusEl.textContent='Same track. Same physics. Let them run.';running=false;
}
async function startRace(){
 if(running)return;resetRace();startBtn.disabled=true;startBtn.textContent='RACING…';statusEl.textContent='';
 showCount('3');await wait(650);showCount('2');await wait(650);showCount('1');await wait(650);showCount('GO!');await wait(220);
 if(gateBody){world.removeBody(gateBody);gateBody=null}if(gateMesh){scene.remove(gateMesh);gateMesh=null}
 marbleBodies.forEach(b=>{b.velocity.x+=(Math.random()-.5)*.08;b.velocity.z+=(Math.random()-.5)*.16;b.angularVelocity.z+=(Math.random()-.5)*.5;});
 running=true;raceStart=performance.now();ping(830,.18,.1);
}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function finish(i){
 if(finishOrder.indexOf(i)!==-1)return;finishOrder.push(i);if(finishOrder.length===1){const r=racers[i];winnerBall.style.background=r.css;winnerText.textContent=r.name.toUpperCase()+' WINS!';winnerEl.classList.add('show');statusEl.textContent='First across the line';ping(980,.32,.13);setTimeout(()=>{running=false;startBtn.disabled=false;startBtn.textContent='RACE AGAIN';},1800);}
}
function updateRace(){
 if(!running)return;marbleBodies.forEach((b,i)=>{if(b.position.y<-6.55)finish(i);if(b.position.y<-8){b.position.y=-6.9;b.velocity.set(0,0,0);}});
 const elapsed=performance.now()-raceStart;if(elapsed>17000){marbleBodies.forEach((b,i)=>{if(finishOrder.indexOf(i)===-1)b.applyImpulse(new CANNON.Vec3((Math.random()-.5)*.8,-.4,(Math.random()-.5)*.3),b.position);});raceStart=performance.now()-12000;}
}
function resize(){const w=Math.max(1,wrap.clientWidth),h=Math.max(1,wrap.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function animate(t){requestAnimationFrame(animate);const dt=Math.min((t-lastTime)/1000||1/60,.033);lastTime=t;if(world)world.step(1/60,dt,3);for(let i=0;i<marbleBodies.length;i++){marbleMeshes[i].position.copy(marbleBodies[i].position);marbleMeshes[i].quaternion.copy(marbleBodies[i].quaternion);}updateRace();if(Math.floor(t/160)%2===0)setStandings();renderer.render(scene,camera);}
async function loadModel(path){return new Promise((resolve,reject)=>loader.load(path,g=>resolve(g.scene),undefined,reject))}
async function init(){
 try{
  renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;
  scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(39,1,.1,100);camera.position.set(0,2.0,27);camera.lookAt(0,1.8,0);loader=new GLTFLoader();
  scene.add(new THREE.HemisphereLight(0xeaf6ff,0x52616b,2.2));const sun=new THREE.DirectionalLight(0xffffff,3.4);sun.position.set(-5,12,10);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
  const backdrop=new THREE.Mesh(new THREE.PlaneGeometry(13,23),new THREE.MeshStandardMaterial({color:0xb9cdd7,roughness:1}));backdrop.position.set(0,1.8,-2.3);backdrop.receiveShadow=true;scene.add(backdrop);
  const base='assets/kenney-marble/';
  const models=await Promise.all([loadModel(base+'straight-wide.glb'),loadModel(base+'marble-high.glb'),loadModel(base+'tunnel.glb'),loadModel(base+'bump-a.glb'),loadModel(base+'banner-double-high.glb'),loadModel(base+'funnel.glb')]);
  [trackTemplate,marbleTemplate,tunnelTemplate,bumpTemplate,bannerTemplate,funnelTemplate]=models;
  buildWorld();resetRace();resize();window.addEventListener('resize',resize);requestAnimationFrame(animate);
 }catch(err){console.error(err);errorEl.classList.add('show');startBtn.disabled=true;startBtn.textContent='TRACK ERROR';statusEl.textContent='';}
}
startBtn.addEventListener('click',startRace);soundBtn.addEventListener('click',()=>{soundOn=!soundOn;soundBtn.textContent=soundOn?'♪':'×';soundBtn.setAttribute('aria-label',soundOn?'Mute sound':'Turn sound on');if(soundOn)ping(600,.08,.05);});
init();
</script>
</body>
</html>
