<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#14212a">
<title>Marble Race · GameBox</title>
<style>
:root{font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7fbff;background:#14212a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#294554 0,#172832 42%,#0d171d 100%);overflow:hidden}body{min-height:100dvh}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom))}
.hud{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}.iconBtn{width:44px;height:44px;border:1px solid #4b6574;border-radius:13px;background:linear-gradient(#304a59,#1e303b);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:1000;text-decoration:none;box-shadow:0 4px 0 #081015}.iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #081015}.gameTitle{text-align:center;min-width:0}.gameTitle strong{display:block;font-size:clamp(20px,5vw,26px);line-height:1}.gameTitle small{display:block;margin-top:4px;color:#a9bfcb;font-size:10px;font-weight:1000;letter-spacing:.15em}
.stageWrap{position:relative;min-height:0;overflow:hidden;border:1px solid #405765;border-radius:19px;background:#c7dbe5;box-shadow:inset 0 0 0 2px rgba(255,255,255,.24),0 10px 26px rgba(0,0,0,.28)}#stage{display:block;width:100%;height:100%;min-height:445px;touch-action:none}
.standings{position:absolute;left:8px;right:8px;top:8px;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;pointer-events:none}.racerChip{min-width:0;padding:6px 3px;border:1px solid rgba(255,255,255,.13);border-radius:11px;background:rgba(12,22,28,.84);text-align:center;backdrop-filter:blur(5px)}.racerChip b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rank{display:block;margin-top:2px;color:#b7c8d2;font-size:10px;font-weight:1000}.dot{display:inline-block;width:12px;height:12px;margin-right:4px;border:2px solid rgba(255,255,255,.85);border-radius:50%;vertical-align:-2px}
.countdown{position:absolute;inset:0;z-index:6;display:grid;place-items:center;pointer-events:none;font-size:clamp(70px,25vw,124px);font-weight:1000;color:#fff;text-shadow:0 7px 0 rgba(0,0,0,.25),0 0 24px rgba(255,255,255,.7);opacity:0}.countdown.show{animation:count .7s ease both}@keyframes count{0%{opacity:0;transform:scale(.55)}35%{opacity:1;transform:scale(1.06)}100%{opacity:0;transform:scale(1.28)}}
.winner{position:absolute;left:50%;top:54%;z-index:7;transform:translate(-50%,-50%) scale(.88);width:min(84%,320px);padding:18px;border:2px solid rgba(255,255,255,.88);border-radius:19px;background:rgba(13,23,30,.96);text-align:center;opacity:0;pointer-events:none;box-shadow:0 16px 40px rgba(0,0,0,.38)}.winner.show{animation:pop .23s ease forwards}@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.winnerBall{width:62px;height:62px;margin:0 auto 8px;border:4px solid rgba(255,255,255,.9);border-radius:50%;box-shadow:inset -11px -11px 0 rgba(0,0,0,.14),0 6px 14px rgba(0,0,0,.32)}.winner small{display:block;color:#afc2ce;font-size:11px;font-weight:1000;letter-spacing:.16em}.winner strong{display:block;margin-top:3px;font-size:30px;line-height:1.05}
.controls{display:grid;gap:7px}.primary{min-height:58px;border:1px solid #f7d785;border-radius:15px;background:linear-gradient(#ffdb7a,#e7ab3d);color:#2c210d;font-size:19px;font-weight:1000;letter-spacing:.04em;box-shadow:0 6px 0 #936219,0 9px 18px rgba(0,0,0,.2)}.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #936219}.primary:disabled{filter:saturate(.35);color:#716653}.status{text-align:center;color:#a9bdc9;font-size:11px;font-weight:900;min-height:14px}.error{position:absolute;inset:0;z-index:9;display:none;place-items:center;padding:30px;background:#17252e;text-align:center}.error.show{display:grid}.error strong{display:block;font-size:20px;margin-bottom:5px}
@media(max-height:650px){#stage{min-height:355px}.primary{min-height:50px}.hud{grid-template-columns:40px 1fr 40px}.iconBtn{width:40px;height:40px}}
@media(prefers-reduced-motion:reduce){.countdown.show,.winner.show{animation:none;opacity:1}.winner.show{transform:translate(-50%,-50%) scale(1)}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main class="app">
<header class="hud">
<a class="iconBtn" href="../" aria-label="Back to GameBox">←</a>
<div class="gameTitle"><strong>Marble Race</strong><small>MARBLE TOWER</small></div>
<button class="iconBtn" id="sound" type="button" aria-label="Toggle sound">♪</button>
</header>
<section class="stageWrap" id="stageWrap">
<canvas id="stage" aria-label="Four-colour marble race simulation"></canvas>
<div class="standings" id="standings" aria-live="polite"></div>
<div class="countdown" id="countdown"></div>
<div class="winner" id="winner"><div class="winnerBall" id="winnerBall"></div><small>WINNER</small><strong id="winnerText"></strong></div>
<div class="error" id="error"><div><strong>Track failed to load.</strong><span>Refresh and try again.</span></div></div>
</section>
<footer class="controls">
<button class="primary" id="start" type="button" disabled>Loading marble tower…</button>
<div class="status" id="status">Kenney Marble Kit course</div>
</footer>
</main>

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.getElementById('stage');
const wrap=document.getElementById('stageWrap');
const startBtn=document.getElementById('start');
const statusEl=document.getElementById('status');
const standingsEl=document.getElementById('standings');
const countdownEl=document.getElementById('countdown');
const winnerEl=document.getElementById('winner');
const winnerBall=document.getElementById('winnerBall');
const winnerText=document.getElementById('winnerText');
const soundBtn=document.getElementById('sound');
const errorEl=document.getElementById('error');

const RACERS=[
 {name:'Red',hex:0xe54852,css:'#e54852'},
 {name:'Blue',hex:0x397fe5,css:'#397fe5'},
 {name:'Green',hex:0x45b467,css:'#45b467'},
 {name:'Yellow',hex:0xf0c643,css:'#f0c643'}
];

const S=1.25;
const R=2.5*S;
const HELIX_DROP=2*S;
const HELIX_TOP_Y=5;
const HELIX_ORIGINS=[HELIX_TOP_Y,HELIX_TOP_Y-HELIX_DROP,HELIX_TOP_Y-HELIX_DROP*2];
const TOP_FLOOR=HELIX_TOP_Y+2.25*S;
const BOTTOM_FLOOR=HELIX_ORIGINS[2]+.25*S;
const START_X=6*S;
const FINISH_X=-4*S;
const START_HIGH=TOP_FLOOR+.75*S;
const FINISH_LOW=BOTTOM_FLOOR-.5*S;
const BALL_R=.13;
const LANE_VALUES=[-.36,-.12,.12,.36];
const START_LEN=START_X;
const HELIX_LEN=Math.hypot(2*Math.PI*R,HELIX_DROP);
const FINISH_LEN=Math.abs(FINISH_X);
const TOTAL_LEN=START_LEN+HELIX_LEN*3+FINISH_LEN;
const SLOPE_ANGLE=Math.atan((.25*S)/(2*S));
const FLOOR_CLEARANCE=BALL_R+.045;

let renderer,scene,camera,loader;
let slantAsset,helixAsset,marbleAsset,bannerAsset;
let marbles=[];
let gate=null;
let raceActive=false;
let raceFinished=false;
let finishOrder=[];
let last=0;
let standingsTimer=0;
let soundOn=true;
let audioCtx=null;

function beep(freq,dur,vol){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle';o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function showCount(v){
 countdownEl.textContent=v;
 countdownEl.classList.remove('show');
 void countdownEl.offsetWidth;
 countdownEl.classList.add('show');
 beep(v==='GO!'?760:440,.11,.07);
}
function rankText(n){return n===0?'1ST':n===1?'2ND':n===2?'3RD':'4TH'}

function cloneAsset(source,scale=1){
 const g=source.clone(true);
 g.scale.setScalar(scale);
 g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
 return g;
}

function buildSlant(centerX,centerY){
 const g=cloneAsset(slantAsset,S);
 g.position.set(centerX,centerY,R);
 g.rotation.y=Math.PI/2;
 scene.add(g);
 return g;
}

function buildCourse(){
 buildSlant(5*S,8.125);
 buildSlant(3*S,7.8125);
 buildSlant(1*S,7.5);

 HELIX_ORIGINS.forEach(y=>{
  const h=cloneAsset(helixAsset,S);
  h.position.set(0,y,0);
  scene.add(h);
 });

 buildSlant(-1*S,-.3125);
 buildSlant(-3*S,-.625);



 const startArch=cloneAsset(bannerAsset,1.9);
 startArch.position.set(5.55*S,8.42,R);
 startArch.rotation.y=Math.PI/2;
 scene.add(startArch);

 const finishArch=cloneAsset(bannerAsset,1.9);
 finishArch.position.set(-3.55*S,-.18,R);
 finishArch.rotation.y=Math.PI/2;
 scene.add(finishArch);

 const base=new THREE.Mesh(
  new THREE.CylinderGeometry(4.15,4.3,.22,40),
  new THREE.MeshStandardMaterial({color:0x607767,roughness:.95})
 );
 base.position.set(0,-.91,0);
 base.receiveShadow=true;
 scene.add(base);

 const ground=new THREE.Mesh(
  new THREE.PlaneGeometry(28,24),
  new THREE.MeshStandardMaterial({color:0x8bad79,roughness:1})
 );
 ground.rotation.x=-Math.PI/2;
 ground.position.y=-1.03;
 ground.receiveShadow=true;
 scene.add(ground);

 const gateBar=new THREE.Mesh(
  new THREE.BoxGeometry(.11,.15,1.05*S),
  new THREE.MeshStandardMaterial({color:0xe7b442,roughness:.38,metalness:.1})
 );
 gateBar.position.set(5.68*S,8.72,R);
 gateBar.rotation.z=SLOPE_ANGLE;
 gateBar.castShadow=true;
 scene.add(gateBar);
 gate=gateBar;

 const finish=new THREE.Group();
 const stripeW=(1.02*S)/8;
 for(let i=0;i<8;i++){
  const tile=new THREE.Mesh(
   new THREE.BoxGeometry(.22,stripeW,.018),
   new THREE.MeshBasicMaterial({color:i%2?0xffffff:0x101010})
  );
  tile.rotation.x=Math.PI/2;
  tile.position.z=-.51*S+stripeW/2+i*stripeW;
  finish.add(tile);
 }
 finish.position.set(-3.62*S,-.1,R);
 finish.rotation.z=SLOPE_ANGLE;
 scene.add(finish);
}

function createMarble(color){
 const g=marbleAsset.clone(true);
 g.traverse(n=>{
  if(n.isMesh){
   n.material=new THREE.MeshStandardMaterial({
    color,
    roughness:.17,
    metalness:.18
   });
   n.castShadow=true;
  }
 });
 const box=new THREE.Box3().setFromObject(g);
 const size=new THREE.Vector3();
 box.getSize(size);
 g.scale.setScalar((BALL_R*2)/Math.max(size.x,size.y,size.z));
 return g;
}

function laneLift(lane){
 return Math.abs(lane)/.36*.035;
}

function poseAtDistance(distance,lane){
 let d=Math.max(0,Math.min(TOTAL_LEN,distance));
 let x=0,y=0,z=R;
 let tangent=new THREE.Vector3(-1,0,0);

 if(d<=START_LEN){
  const u=d/START_LEN;
  x=START_X*(1-u);
  y=THREE.MathUtils.lerp(START_HIGH,TOP_FLOOR,u);
  z=R+lane;
  tangent.set(-START_X,TOP_FLOOR-START_HIGH,0).normalize();
  return {position:new THREE.Vector3(x,y+FLOOR_CLEARANCE+laneLift(lane),z),tangent};
 }

 d-=START_LEN;

 for(let h=0;h<3;h++){
  if(d<=HELIX_LEN){
   const u=d/HELIX_LEN;
   const theta=Math.PI/2+Math.PI*2*u;
   const radial=new THREE.Vector3(Math.cos(theta),0,Math.sin(theta));
   x=radial.x*(R+lane);
   z=radial.z*(R+lane);
   y=HELIX_ORIGINS[h]+2.25*S-HELIX_DROP*u;
   const dx=-Math.sin(theta)*2*Math.PI*(R+lane);
   const dz=Math.cos(theta)*2*Math.PI*(R+lane);
   tangent.set(dx,-HELIX_DROP,dz).normalize();
   return {position:new THREE.Vector3(x,y+FLOOR_CLEARANCE+laneLift(lane),z),tangent};
  }
  d-=HELIX_LEN;
 }

 const u=d/FINISH_LEN;
 x=FINISH_X*u;
 y=THREE.MathUtils.lerp(BOTTOM_FLOOR,FINISH_LOW,u);
 z=R+lane;
 tangent.set(FINISH_X,FINISH_LOW-BOTTOM_FLOOR,0).normalize();
 return {position:new THREE.Vector3(x,y+FLOOR_CLEARANCE+laneLift(lane),z),tangent};
}

function resetRace(){
 marbles.forEach(m=>scene.remove(m.mesh));
 marbles=[];
 finishOrder=[];
 raceFinished=false;
 raceActive=false;
 winnerEl.classList.remove('show');

 if(gate){
  gate.visible=true;
  gate.position.set(5.68*S,8.72,R);
  gate.rotation.set(0,0,SLOPE_ANGLE);
 }

 const shuffled=[...LANE_VALUES].sort(()=>Math.random()-.5);
 RACERS.forEach((r,i)=>{
  const mesh=createMarble(r.hex);
  scene.add(mesh);
  const lane=shuffled[i];
  const pose=poseAtDistance(0,lane);
  mesh.position.copy(pose.position);
  marbles.push({
   racerIndex:i,
   mesh,
   distance:0,
   speed:4.85+Math.random()*.3,
   targetSpeed:4.8+Math.random()*.45,
   lane,
   laneTarget:lane,
   nextDecision:.6+Math.random()*1.2,
   finished:false,
   finishTime:0
  });
 });

 updateStandings();
 startBtn.disabled=false;
 startBtn.textContent='START RACE';
 statusEl.textContent='Four colours. One continuous Kenney marble tower.';
}

function releaseGate(){
 if(!gate)return;
 let f=0;
 const tick=()=>{
  f+=.12;
  gate.position.y+=.06;
  gate.rotation.x+=.09;
  if(f<1)requestAnimationFrame(tick);else gate.visible=false;
 };
 tick();
}

function chooseLaneTarget(m){
 const options=[...LANE_VALUES];
 const currentIndex=options.indexOf(m.laneTarget);
 const candidates=options.filter((_,i)=>i!==currentIndex);
 m.laneTarget=candidates[Math.floor(Math.random()*candidates.length)];
 m.targetSpeed=4.65+Math.random()*.75;
 m.nextDecision=.8+Math.random()*1.5;
}

function simulateRace(dt,now){
 if(!raceActive)return;

 for(const m of marbles){
  if(m.finished)continue;

  m.nextDecision-=dt;
  if(m.nextDecision<=0)chooseLaneTarget(m);

  m.speed+=THREE.MathUtils.clamp(m.targetSpeed-m.speed,-.55*dt,.55*dt);
  m.lane=THREE.MathUtils.lerp(m.lane,m.laneTarget,1-Math.pow(.08,dt));
  m.distance+=m.speed*dt;

  if(m.distance>=TOTAL_LEN){
   m.distance=TOTAL_LEN;
   m.finished=true;
   m.finishTime=now;
   finishOrder.push(m);
   if(finishOrder.length===1)declareWinner(m);
  }
 }

 for(let i=0;i<marbles.length;i++){
  for(let j=i+1;j<marbles.length;j++){
   const a=marbles[i],b=marbles[j];
   if(a.finished||b.finished)continue;
   const gap=Math.abs(a.distance-b.distance);
   const laneGap=Math.abs(a.lane-b.lane);
   if(gap<.32&&laneGap<.18){
    const temp=a.targetSpeed;
    a.targetSpeed=b.targetSpeed*.98;
    b.targetSpeed=temp*1.02;
    a.laneTarget=LANE_VALUES[Math.floor(Math.random()*LANE_VALUES.length)];
    b.laneTarget=LANE_VALUES[Math.floor(Math.random()*LANE_VALUES.length)];
   }
  }
 }

 marbles.forEach(m=>{
  const pose=poseAtDistance(m.distance,m.lane);
  m.mesh.position.copy(pose.position);
  const axis=new THREE.Vector3(0,0,1).cross(pose.tangent).normalize();
  if(Number.isFinite(axis.x))m.mesh.rotateOnWorldAxis(axis,m.speed*dt/(BALL_R*1.2));
 });
}

function declareWinner(m){
 raceFinished=true;
 const r=RACERS[m.racerIndex];
 winnerBall.style.background='radial-gradient(circle at 30% 26%,#fff 0 7%,'+r.css+' 23%,#18232a 140%)';
 winnerText.textContent=r.name.toUpperCase()+' WINS!';
 setTimeout(()=>winnerEl.classList.add('show'),350);
 beep(980,.34,.13);
 statusEl.textContent='First marble across the finish line';
 setTimeout(()=>{
  raceActive=false;
  startBtn.disabled=false;
  startBtn.textContent='RACE AGAIN';
 },1800);
}

function updateStandings(){
 const order=[...marbles].sort((a,b)=>{
  if(a.finished&&b.finished)return a.finishTime-b.finishTime;
  if(a.finished)return -1;
  if(b.finished)return 1;
  return b.distance-a.distance;
 });
 standingsEl.innerHTML='';
 order.forEach((m,rank)=>{
  const r=RACERS[m.racerIndex];
  const d=document.createElement('div');
  d.className='racerChip';
  d.innerHTML='<b><span class="dot" style="background:'+r.css+'"></span>'+r.name+'</b><span class="rank">'+(m.finished?'FINISHED':rankText(rank))+'</span>';
  standingsEl.appendChild(d);
 });
}

async function startRace(){
 if(raceActive)return;
 resetRace();
 startBtn.disabled=true;
 startBtn.textContent='RACING…';
 statusEl.textContent='';
 showCount('3');await wait(650);
 showCount('2');await wait(650);
 showCount('1');await wait(650);
 showCount('GO!');await wait(160);
 releaseGate();
 raceActive=true;
 beep(820,.18,.09);
}

function resize(){
 const w=Math.max(1,wrap.clientWidth);
 const h=Math.max(1,wrap.clientHeight);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();

 const portrait=camera.aspect<.9;
 // High three-quarter view so the open channel and all spiral levels remain visible.
 camera.position.set(
  portrait?11.5:10.5,
  portrait?21.0:18.0,
  portrait?19.5:17.0
 );
 camera.lookAt(new THREE.Vector3(.8,3.55,0));
}

function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/1000||1/60,.033);
 last=t;

 simulateRace(dt,t);
 standingsTimer+=dt;
 if(standingsTimer>.16){
  standingsTimer=0;
  updateStandings();
 }

 renderer.render(scene,camera);
}

async function load(path){
 return new Promise((resolve,reject)=>loader.load(path,g=>resolve(g.scene),undefined,reject));
}

async function init(){
 try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  scene=new THREE.Scene();
  scene.background=new THREE.Color(0xc5dce7);
  scene.fog=new THREE.Fog(0xc5dce7,24,46);

  camera=new THREE.PerspectiveCamera(44,1,.1,100);
  loader=new GLTFLoader();

  scene.add(new THREE.HemisphereLight(0xf8fcff,0x5f7158,2.2));
  const sun=new THREE.DirectionalLight(0xffffff,3.2);
  sun.position.set(-8,14,9);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.left=-14;
  sun.shadow.camera.right=14;
  sun.shadow.camera.top=16;
  sun.shadow.camera.bottom=-12;
  scene.add(sun);

  const base='assets/kenney-marble/';
  [
   slantAsset,
   helixAsset,
   marbleAsset,
   bannerAsset
  ]=await Promise.all([
   load(base+'slant-long-a.glb'),
   load(base+'helix-large-left.glb'),
   load(base+'marble-high.glb'),
   load(base+'banner-double-high.glb')
  ]);

  buildCourse();
  resetRace();
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(animate);
 }catch(err){
  console.error(err);
  errorEl.classList.add('show');
  startBtn.disabled=true;
  startBtn.textContent='TRACK ERROR';
  statusEl.textContent='';
 }
}

startBtn.addEventListener('click',startRace);
soundBtn.addEventListener('click',()=>{
 soundOn=!soundOn;
 soundBtn.textContent=soundOn?'♪':'×';
 soundBtn.setAttribute('aria-label',soundOn?'Mute sound':'Turn sound on');
 if(soundOn)beep(600,.08,.05);
});
init();
</script>
</body>
</html>
