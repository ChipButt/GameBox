<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#16212b">
<title>Marble Race · GameBox</title>
<style>
:root{font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f7fbff;background:#16212b;--panel:#1d2a35;--line:#314553;--gold:#f1bd54}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,#284152 0,#182630 38%,#101920 100%);overflow:hidden}body{min-height:100dvh}.app{position:relative;min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto;padding:max(10px,env(safe-area-inset-top)) 10px max(12px,env(safe-area-inset-bottom));gap:8px}.hud{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;z-index:5}.home,.sound{width:44px;height:44px;border:1px solid #496171;background:linear-gradient(#2d4251,#1e2e3a);color:white;border-radius:12px;font-size:20px;box-shadow:0 4px 0 #0b1116;display:grid;place-items:center;text-decoration:none}.home:active,.sound:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1116}.title{text-align:center;min-width:0}.title strong{display:block;font-size:clamp(18px,5vw,24px);letter-spacing:.02em}.title small{display:block;color:#a9becb;font-size:11px;font-weight:800;letter-spacing:.16em}.stageWrap{position:relative;min-height:0;border:1px solid #405665;border-radius:18px;overflow:hidden;background:linear-gradient(#dce8ee,#b7cbd5);box-shadow:inset 0 0 0 2px rgba(255,255,255,.22),0 8px 22px rgba(0,0,0,.28)}#stage{display:block;width:100%;height:100%;min-height:420px}.standings{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;z-index:3;pointer-events:none}.racerChip{min-width:0;background:rgba(13,23,30,.84);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:5px 4px;text-align:center;backdrop-filter:blur(5px)}.racerChip b{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-2px;border:2px solid rgba(255,255,255,.75)}.rank{font-size:10px;color:#b8cad4;font-weight:900}.countdown{position:absolute;inset:0;display:grid;place-items:center;z-index:4;pointer-events:none;font-size:clamp(64px,24vw,118px);font-weight:1000;color:white;text-shadow:0 6px 0 rgba(0,0,0,.25),0 0 25px rgba(255,255,255,.7);opacity:0;transform:scale(.65)}.countdown.show{animation:count .72s ease both}@keyframes count{0%{opacity:0;transform:scale(.5)}35%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.35)}}.winner{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.85);width:min(86%,320px);padding:18px;border:2px solid rgba(255,255,255,.82);border-radius:18px;background:rgba(15,25,33,.94);text-align:center;z-index:6;opacity:0;pointer-events:none;box-shadow:0 14px 35px rgba(0,0,0,.35)}.winner.show{animation:pop .25s ease forwards}@keyframes pop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}.winnerBall{width:56px;height:56px;border-radius:50%;margin:0 auto 8px;border:4px solid rgba(255,255,255,.88);box-shadow:inset -10px -10px 0 rgba(0,0,0,.12),0 5px 12px rgba(0,0,0,.32)}.winner small{display:block;color:#afc2cf;font-weight:900;letter-spacing:.15em}.winner strong{display:block;font-size:30px;line-height:1.05;margin-top:3px}.controls{display:grid;grid-template-columns:1fr;gap:7px;z-index:5}.primary{min-height:58px;border:1px solid #f6d487;border-radius:15px;background:linear-gradient(#ffd874,#e9ad3c);color:#2d210b;font-size:19px;font-weight:1000;letter-spacing:.04em;box-shadow:0 6px 0 #96651a,0 9px 16px rgba(0,0,0,.22)}.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #96651a}.primary:disabled{filter:saturate(.35);color:#6d6251}.status{text-align:center;color:#a9becb;font-size:11px;font-weight:800;min-height:14px}.error{position:absolute;inset:0;display:none;place-items:center;padding:28px;text-align:center;background:#17242d;color:white;z-index:8}.error.show{display:grid}.error strong{display:block;font-size:20px;margin-bottom:5px}@media (max-height:650px){#stage{min-height:340px}.primary{min-height:50px}.hud{grid-template-columns:40px 1fr 40px}.home,.sound{width:40px;height:40px}}@media (prefers-reduced-motion:reduce){.countdown.show,.winner.show{animation:none;opacity:1;transform:translate(-50%,-50%) scale(1)}.countdown.show{transform:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<main class="app">
<header class="hud"><a class="home" href="../" aria-label="Back to GameBox">←</a><div class="title"><strong>Marble Race</strong><small>4 MARBLES · 1 WINNER</small></div><button class="sound" id="sound" type="button" aria-label="Toggle sound">♪</button></header>
<section class="stageWrap" id="stageWrap" aria-label="Marble race track">
<canvas id="stage"></canvas>
<div class="standings" id="standings" aria-live="polite"></div>
<div class="countdown" id="countdown"></div>
<div class="winner" id="winner"><div class="winnerBall" id="winnerBall"></div><small>WINNER</small><strong id="winnerText">BLUE!</strong></div>
<div class="error" id="error"><div><strong>Couldn’t start the race.</strong><span>Refresh and try again.</span></div></div>
</section>
<footer class="controls"><button class="primary" id="start" type="button" disabled>Loading track…</button><div class="status" id="status">Continuous Kenney Marble Kit run</div></footer>
</main>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

const canvas=document.getElementById('stage');
const wrap=document.getElementById('stageWrap');
const startBtn=document.getElementById('start');
const statusEl=document.getElementById('status');
const standingsEl=document.getElementById('standings');
const countdownEl=document.getElementById('countdown');
const winnerEl=document.getElementById('winner');
const winnerBall=document.getElementById('winnerBall');
const winnerText=document.getElementById('winnerText');
const soundBtn=document.getElementById('sound');
const errorEl=document.getElementById('error');

const racers=[
 {name:'Red',hex:0xe94c54,css:'#e94c54'},
 {name:'Blue',hex:0x3d82e7,css:'#3d82e7'},
 {name:'Green',hex:0x4db66a,css:'#4db66a'},
 {name:'Yellow',hex:0xf1c94b,css:'#f1c94b'}
];

let renderer,scene,camera,loader,curve,marbleSource;
let marbles=[],raceActive=false,raceFinished=false,last=0;
let soundOn=true,audioCtx=null;
let cameraTarget=new THREE.Vector3(0,5,0);
let cameraPos=new THREE.Vector3(7,8,15);
const up=new THREE.Vector3(0,1,0);

function beep(freq,dur,vol){
 if(!soundOn)return;
 try{
  audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type='triangle';o.frequency.value=freq;g.gain.value=vol;
  o.connect(g);g.connect(audioCtx.destination);o.start();
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.stop(audioCtx.currentTime+dur);
 }catch(e){}
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function showCount(v){
 countdownEl.textContent=v;
 countdownEl.classList.remove('show');
 void countdownEl.offsetWidth;
 countdownEl.classList.add('show');
 beep(v==='GO!'?760:440,.11,.07);
}
function rankLabel(n){return n===0?'1ST':n===1?'2ND':n===2?'3RD':'4TH'}
function updateStandings(){
 const order=marbles.map((m,i)=>({i,p:m.progress})).sort((a,b)=>b.p-a.p);
 standingsEl.innerHTML='';
 order.forEach((o,rank)=>{
  const r=racers[o.i],d=document.createElement('div');
  d.className='racerChip';
  d.innerHTML='<b><span class="dot" style="background:'+r.css+'"></span>'+r.name+'</b><span class="rank">'+rankLabel(rank)+'</span>';
  standingsEl.appendChild(d);
 });
}
function cloneMarble(color){
 const g=marbleSource.clone(true);
 g.traverse(n=>{
  if(n.isMesh){
   n.material=new THREE.MeshStandardMaterial({color,roughness:.18,metalness:.2});
   n.castShadow=true;
  }
 });
 const box=new THREE.Box3().setFromObject(g),size=new THREE.Vector3();
 box.getSize(size);
 g.scale.setScalar(.5/Math.max(size.x,size.y,size.z));
 return g;
}
function trackClone(source,scale=1){
 const g=source.clone(true);
 g.scale.setScalar(scale);
 g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
 return g;
}
function fitSegment(source,width,length){
 const g=source.clone(true);
 g.updateMatrixWorld(true);
 const box=new THREE.Box3().setFromObject(g),size=new THREE.Vector3();
 box.getSize(size);
 const sx=width/Math.max(size.x,.01),sz=length/Math.max(size.z,.01);
 const sy=(sx+sz)*.5;
 g.scale.set(sx,sy,sz);
 g.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}});
 return g;
}
function orientAlong(obj,tangent){
 obj.quaternion.setFromUnitVectors(new THREE.Vector3(0,0,1),tangent.clone().normalize());
}
function placeSpecial(source,t,scale=1,offset=new THREE.Vector3()){
 const g=trackClone(source,scale),p=curve.getPointAt(t),tan=curve.getTangentAt(t);
 g.position.copy(p).add(offset);
 orientAlong(g,tan);
 scene.add(g);
 return g;
}
function buildTrack(models){
 const [straight,curveLarge,sCurve,helix,tunnel,funnel,banner,endPiece]=models;

 curve=new THREE.CatmullRomCurve3([
  new THREE.Vector3(-2.8,8.6,0),
  new THREE.Vector3(-1.3,8.1,-.2),
  new THREE.Vector3(.7,7.2,-.3),
  new THREE.Vector3(2.5,6.1,.3),
  new THREE.Vector3(3.2,5.0,1.2),
  new THREE.Vector3(2.5,3.9,2.0),
  new THREE.Vector3(.8,3.0,1.4),
  new THREE.Vector3(-1.3,2.0,.2),
  new THREE.Vector3(-2.6,1.0,-1.3),
  new THREE.Vector3(-2.0,.0,-2.5),
  new THREE.Vector3(-.2,-.8,-2.8),
  new THREE.Vector3(1.7,-1.5,-1.7),
  new THREE.Vector3(2.0,-2.3,.5),
  new THREE.Vector3(.7,-3.1,2.0),
  new THREE.Vector3(-1.2,-3.8,1.6),
  new THREE.Vector3(-2.0,-4.5,.2),
  new THREE.Vector3(-1.2,-5.2,-1.0),
  new THREE.Vector3(.2,-5.8,-1.2),
  new THREE.Vector3(1.5,-6.4,-.4),
  new THREE.Vector3(.8,-7.0,.4),
  new THREE.Vector3(0,-8.2,0)
 ],false,'centripetal',.35);

 const count=44;
 for(let i=0;i<count;i++){
  const t=(i+.5)/count;
  if((t>.44&&t<.59)||(t>.86&&t<.94))continue;
  const p=curve.getPointAt(t),tan=curve.getTangentAt(t);
  const next=curve.getPointAt(Math.min(1,t+1/count));
  const len=Math.max(.7,p.distanceTo(next)*1.75);
  const seg=fitSegment(straight,2.0,len);
  seg.position.copy(p);
  orientAlong(seg,tan);
  scene.add(seg);
 }

 const cv=placeSpecial(curveLarge,.23,.72);cv.position.add(new THREE.Vector3(.15,.03,0));
 const sc=placeSpecial(sCurve,.37,.46);sc.position.add(new THREE.Vector3(-.1,.02,0));

 const hx=trackClone(helix,.62);
 hx.position.copy(curve.getPointAt(.52));
 hx.position.y-=.75;
 scene.add(hx);

 const tn=placeSpecial(tunnel,.76,1.35);tn.position.y+=.08;
 const fn=placeSpecial(funnel,.91,1.65);fn.position.y+=.04;
 const en=placeSpecial(endPiece,.988,1.7);en.position.y-=.03;

 const bn=trackClone(banner,1.25);
 bn.position.copy(curve.getPointAt(.985)).add(new THREE.Vector3(0,.6,-.3));
 bn.rotation.y=Math.PI/2;
 scene.add(bn);

 const floor=new THREE.Mesh(
  new THREE.PlaneGeometry(18,18),
  new THREE.MeshStandardMaterial({color:0x93b780,roughness:1})
 );
 floor.rotation.x=-Math.PI/2;
 floor.position.y=-9;
 floor.receiveShadow=true;
 scene.add(floor);
}
function resetRace(){
 marbles.forEach(m=>scene.remove(m.mesh));
 marbles=[];
 winnerEl.classList.remove('show');
 raceFinished=false;
 raceActive=false;

 racers.forEach((r,i)=>{
  const mesh=cloneMarble(r.hex);
  scene.add(mesh);
  marbles.push({
   mesh,
   progress:0,
   speed:.042+Math.random()*.005,
   lane:(i-1.5)*.12,
   phase:Math.random()*10
  });
 });
 updateMarbles(0);
 updateStandings();
 startBtn.disabled=false;
 startBtn.textContent='START RACE';
 statusEl.textContent='One continuous Kenney marble run.';
}
function updateMarbles(dt){
 if(raceActive&&!raceFinished){
  for(const m of marbles){
   const wobble=Math.sin(performance.now()*.0015+m.phase)*.0035;
   const sectionDrag=(m.progress>.45&&m.progress<.60)?-.0045:(m.progress>.86&&m.progress<.94)?-.003:0;
   m.speed=THREE.MathUtils.clamp(m.speed+(Math.random()-.5)*.0024+sectionDrag*dt,.034,.058);
   m.progress=Math.min(1,m.progress+(m.speed+wobble)*dt);
   if(m.progress>=1&&!raceFinished){
    raceFinished=true;
    finishRace(marbles.indexOf(m));
   }
  }
 }

 for(const m of marbles){
  const t=Math.min(.999,m.progress);
  const p=curve.getPointAt(t),tan=curve.getTangentAt(t).normalize();
  const side=new THREE.Vector3().crossVectors(up,tan).normalize();
  const lateral=m.lane+Math.sin(m.progress*24+m.phase)*.05;
  m.mesh.position.copy(p).add(side.multiplyScalar(lateral)).add(new THREE.Vector3(0,.28,0));
  m.mesh.rotation.x+=dt*8;
  m.mesh.rotation.z+=dt*6;
 }
}
function finishRace(index){
 const r=racers[index];
 winnerBall.style.background=r.css;
 winnerText.textContent=r.name.toUpperCase()+' WINS!';
 winnerEl.classList.add('show');
 beep(980,.35,.12);
 startBtn.disabled=true;
 statusEl.textContent='Winner confirmed';
 setTimeout(()=>{
  raceActive=false;
  startBtn.disabled=false;
  startBtn.textContent='RACE AGAIN';
 },1500);
}
async function startRace(){
 if(raceActive)return;
 resetRace();
 startBtn.disabled=true;
 startBtn.textContent='RACING…';
 statusEl.textContent='';
 showCount('3');await wait(650);
 showCount('2');await wait(650);
 showCount('1');await wait(650);
 showCount('GO!');await wait(180);
 raceActive=true;
 beep(820,.18,.09);
}
function updateCamera(dt){
 let lead=0;
 for(const m of marbles)lead=Math.max(lead,m.progress);
 const center=curve.getPointAt(Math.min(.97,lead+.035));
 const target=center.clone().add(new THREE.Vector3(0,.2,0));
 const pos=center.clone().add(new THREE.Vector3(7.2,4.7,14.2));
 cameraTarget.lerp(target,1-Math.pow(.001,dt));
 cameraPos.lerp(pos,1-Math.pow(.001,dt));
 camera.position.copy(cameraPos);
 camera.lookAt(cameraTarget);
}
function resize(){
 const w=Math.max(1,wrap.clientWidth),h=Math.max(1,wrap.clientHeight);
 renderer.setSize(w,h,false);
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
}
function animate(t){
 requestAnimationFrame(animate);
 const dt=Math.min((t-last)/1000||1/60,.033);
 last=t;
 if(curve){
  updateMarbles(dt);
  updateCamera(dt);
  if(Math.floor(t/180)%2===0)updateStandings();
 }
 renderer.render(scene,camera);
}
async function load(path){
 return new Promise((resolve,reject)=>loader.load(path,g=>resolve(g.scene),undefined,reject));
}
async function init(){
 try{
  renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.outputColorSpace=THREE.SRGBColorSpace;

  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xcbdde6,14,34);
  camera=new THREE.PerspectiveCamera(43,1,.1,100);
  loader=new GLTFLoader();

  scene.add(new THREE.HemisphereLight(0xf5fbff,0x617261,2.25));
  const sun=new THREE.DirectionalLight(0xffffff,3.1);
  sun.position.set(-6,12,9);
  sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  scene.add(sun);

  const base='assets/kenney-marble/';
  const [straight,curveLarge,sCurve,helix,tunnel,funnel,banner,endPiece,marble]=await Promise.all([
   load(base+'straight-wide.glb'),
   load(base+'curve-large.glb'),
   load(base+'s-curve-left-large.glb'),
   load(base+'helix-large-left.glb'),
   load(base+'tunnel.glb'),
   load(base+'funnel.glb'),
   load(base+'banner-double-high.glb'),
   load(base+'end-rounded.glb'),
   load(base+'marble-high.glb')
  ]);

  marbleSource=marble;
  buildTrack([straight,curveLarge,sCurve,helix,tunnel,funnel,banner,endPiece]);
  resetRace();
  resize();
  window.addEventListener('resize',resize);
  requestAnimationFrame(animate);
 }catch(err){
  console.error(err);
  errorEl.classList.add('show');
  startBtn.disabled=true;
  startBtn.textContent='TRACK ERROR';
  statusEl.textContent='';
 }
}

startBtn.addEventListener('click',startRace);
soundBtn.addEventListener('click',()=>{
 soundOn=!soundOn;
 soundBtn.textContent=soundOn?'♪':'×';
 soundBtn.setAttribute('aria-label',soundOn?'Mute sound':'Turn sound on');
 if(soundOn)beep(600,.08,.05);
});
init();
</script>
</body>
</html>
