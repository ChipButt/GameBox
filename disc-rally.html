<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0875c9">
<title>Disc Rally · Chip In Games</title>
<link rel="stylesheet" href="disc-rally.css?v=44">
</head>
<body>
<div class="discApp">
  <main>
    <section id="modeView" class="view discHomeAssetScreen">
      <div class="discHomeArtboard" aria-label="Disc Rally home">
        <img class="discHomeShell" src="Blank%20UI.png?v=1" alt="" aria-hidden="true">

        <a class="discHomeAssetButton discHomeBack" href="index.html" aria-label="Back to GameBox">
          <img src="GameBox%20back%20button.png?v=1" alt="GameBox">
        </a>

        <button id="localMode" class="discHomeAssetButton discHomePass" type="button" aria-label="Pass and Play">
          <img src="Pass%20%26%20Play%20button.png?v=1" alt="Pass & Play">
        </button>

        <button id="multiMode" class="discHomeAssetButton discHomeMulti" type="button" aria-label="Local Multiplayer">
          <img src="Local%20Multiplayer%20button.png?v=1" alt="Local Multiplayer">
        </button>

        <button id="openSettings" class="discHomeAssetButton discHomeSettings" type="button" aria-label="Settings">
          <img src="Settings%20button.png?v=1" alt="Settings">
        </button>
      </div>
    </section>

    <section id="localSetup" class="view passPlayAssetScreen hidden">
      <div class="passPlayArtboard">
        <img class="passPlayShell" src="Pass%26Play%20UI.png?v=1" alt="" aria-hidden="true">

        <button class="passPlayAsset passPlayBack" data-back="modeView" type="button" aria-label="Back">
          <img src="DR%20Back%20Button.png?v=1" alt="Back">
        </button>

        <div id="localPlayers" class="passPlayPlayers" aria-label="Players"></div>
        <div id="passRosterOptions" class="passPlayRosterPicker hidden"></div>

        <button id="addPassPlayer" class="passPlayAsset passPlayAdd" type="button" aria-label="Add player">
          <img src="06_add_player_button.png?v=1" alt="Add Player">
        </button>
        <button id="removePassPlayer" class="passPlayAsset passPlayRemove" type="button" aria-label="Remove player">
          <img src="07_remove_player_button.png?v=1" alt="Remove Player">
        </button>

        <button id="openTrackSelection" class="passPlayTrackHit" type="button" aria-label="Choose track"></button>
        <span id="selectedTrackIcon" class="passPlayTrackMap" aria-hidden="true"></span>
        <strong id="selectedTrackName" class="passPlayTrackName">Random Track</strong>
        <span class="passPlayTrackHelp">Tap to choose track</span>

        <div class="passPlayLaps" data-lap-group="local" aria-label="Laps">
          <button class="passPlayLap passPlayLap1" type="button" data-laps="1" aria-label="1 lap">
            <img class="passPlaySelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>1</span>
          </button>
          <button class="passPlayLap passPlayLap3 selected" type="button" data-laps="3" aria-label="3 laps">
            <img class="passPlaySelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>3</span>
          </button>
          <button class="passPlayLap passPlayLap5" type="button" data-laps="5" aria-label="5 laps">
            <img class="passPlaySelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>5</span>
          </button>
          <button class="passPlayLap passPlayLap7" type="button" data-laps="7" aria-label="7 laps">
            <img class="passPlaySelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>7</span>
          </button>
          <button class="passPlayLap passPlayLap9" type="button" data-laps="9" aria-label="9 laps">
            <img class="passPlaySelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>9</span>
          </button>
        </div>

        <button id="startLocal" class="passPlayAsset passPlayStart" type="button" aria-label="Start race">
          <img src="11_start_race_button.png?v=1" alt="Start Race">
        </button>

        <div id="localStatus" class="passPlayStatus"></div>
      </div>
      <div id="localTracks" class="hidden"></div>
    </section>

    <section id="trackSelectView" class="view trackSelectionAssetScreen hidden">
      <div id="trackSelectionArtboard" class="trackSelectionArtboard">
        <img class="trackSelectionShell" src="track_selection_blank_ui_background.png?v=1" alt="" aria-hidden="true">

        <button id="trackSelectBack" class="trackSelectionBack" data-back="localSetup" type="button" aria-label="Back">
          <img src="DR%20Back%20Button.png?v=1" alt="Back">
        </button>

        <div class="trackSelectionBanner" aria-hidden="true">
          <img src="track_selection_title_banner.png?v=1" alt="">
        </div>

        <div id="trackGrid" class="trackSelectionGrid" aria-label="Tracks"></div>
      </div>
    </section>

    <section id="multiSetup" class="view roleSelectionAssetScreen hidden">
      <div class="roleSelectionArtboard">
        <img class="roleSelectionShell" src="local_multiplayer_role_selection_blank_ui.png?v=1" alt="" aria-hidden="true">

        <button class="roleSelectionBack" data-back="modeView" type="button" aria-label="Back">
          <img src="DR%20Back%20Button.png?v=1" alt="Back">
        </button>

        <button id="hostMode" class="roleSelectionChoice roleSelectionHost" type="button" aria-label="Host Race">
          <img src="host_race_button.png?v=1" alt="Host Race — Create the game lobby">
        </button>

        <button id="joinMode" class="roleSelectionChoice roleSelectionJoin" type="button" aria-label="Join Race">
          <img src="join_race_button.png?v=1" alt="Join Race — Find a host on another device">
        </button>
      </div>
    </section>

    <section id="hostSetup" class="view hostRaceAssetScreen hidden">
      <div class="hostRaceArtboard">
        <img class="hostRaceShell" src="host_race_blank_ui.png?v=1" alt="" aria-hidden="true">

        <button class="hostRaceBack" data-back="multiSetup" type="button" aria-label="Back">
          <img src="DR%20Back%20Button.png?v=1" alt="Back">
        </button>

        <span id="hostPlayerDisplay" class="hostRacePlayerDisplay">Chip</span>
        <select id="hostPlayer" class="hostRacePlayerSelect" aria-label="This phone is"></select>

        <button id="hostOpenTrackSelection" class="hostRaceTrackHit" type="button" aria-label="Choose track"></button>
        <span id="hostSelectedTrackIcon" class="hostRaceTrackMap" aria-hidden="true"></span>
        <strong id="hostSelectedTrackName" class="hostRaceTrackName">Random Track</strong>
        <span class="hostRaceTrackHelp">Tap to choose track</span>

        <div class="hostRaceLaps" data-lap-group="host" aria-label="Laps">
          <button class="hostRaceLap hostRaceLap1" type="button" data-laps="1" aria-label="1 lap">
            <img class="hostRaceSelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>1</span>
          </button>
          <button class="hostRaceLap hostRaceLap3 selected" type="button" data-laps="3" aria-label="3 laps">
            <img class="hostRaceSelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>3</span>
          </button>
          <button class="hostRaceLap hostRaceLap5" type="button" data-laps="5" aria-label="5 laps">
            <img class="hostRaceSelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>5</span>
          </button>
          <button class="hostRaceLap hostRaceLap7" type="button" data-laps="7" aria-label="7 laps">
            <img class="hostRaceSelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>7</span>
          </button>
          <button class="hostRaceLap hostRaceLap9" type="button" data-laps="9" aria-label="9 laps">
            <img class="hostRaceSelectedLap" src="Lap%20Pill%20Selected.png?v=2" alt=""><span>9</span>
          </button>
        </div>

        <div id="hostStatus" class="hostRaceStatus" aria-hidden="true"></div>
        <div id="hostLobby" class="hostRaceLobby" aria-label="Lobby players"></div>

        <button id="restartHostDiscovery" class="hostRaceRestart" type="button" aria-label="Restart discovery">
          <img src="restart_discovery_button.png?v=1" alt="Restart Discovery">
        </button>

        <button id="startHost" class="hostRaceStart" type="button" disabled aria-label="Start race">
          <img src="11_start_race_button.png?v=1" alt="Start Race">
        </button>

        <div id="hostTracks" class="hidden"></div>
      </div>
    </section>

    <section id="joinSetup" class="view menuScreen hidden">
      <div class="menuBackdrop"></div>
      <header class="whiteHeader">
        <button class="circleBack" data-back="multiSetup" type="button">‹</button>
        <h1>⌕ JOIN RACE</h1>
      </header>

      <section class="setupPanel">
        <div class="panelRibbon">PLAYER</div>
        <label class="gameField">THIS PHONE IS
          <select id="joinPlayer"></select>
        </label>
      </section>

      <section class="setupPanel">
        <div class="panelRibbon">AVAILABLE RACES</div>
        <div class="discoveryStrip"><span class="scanPulse"></span><strong id="joinStatus">Scanning</strong></div>
        <div id="availableHosts" class="hostList"></div>
      </section>

      <section class="setupPanel">
        <div class="panelRibbon">CONNECTED LOBBY</div>
        <div id="joinLobby" class="lobbyList"><div class="empty">Not connected yet.</div></div>
      </section>

      <button id="restartScan" class="fixedBottomAction" type="button">⌕ RESTART SCAN</button>
    </section>

    <section id="settingsView" class="view menuScreen hidden">
      <div class="menuBackdrop"></div>
      <header class="whiteHeader">
        <button class="circleBack" data-back="modeView" type="button">‹</button>
        <h1>⚙ SETTINGS</h1>
      </header>
      <section class="setupPanel settingsPanel">
        <div class="panelRibbon">GAME</div>
        <label class="settingRow"><span><strong>Camera follow</strong><small>Keep the active disc low in the frame</small></span><input id="cameraFollowSetting" type="checkbox" checked></label>
        <label class="settingRow"><span><strong>Motion effects</strong><small>Show speed and impact feedback</small></span><input id="motionSetting" type="checkbox" checked></label>
      </section>
    </section>

    <section id="raceView" class="view raceScreen hidden">
      <div class="raceStage">
        <canvas id="raceCanvas" width="720" height="1280" aria-label="Disc Rally race"></canvas>

        <header class="raceHud">
          <div class="hudPlayer">
            <span id="hudDisc" class="hudDisc"></span>
            <div><small>PLAYER:</small><strong id="hudPlayerName">—</strong></div>
          </div>
          <div class="hudRaceMeta">
            <strong id="hudPosition">1ST</strong>
            <strong id="hudLap">1/2</strong>
          </div>
        </header>

        <div class="raceNavBar">
          <button id="exitRace" type="button">‹</button>
          <span id="trackName">Harbour Loop</span>
          <span id="raceNetwork" class="networkTag hidden">MULTI</span>
        </div>

        <section class="turnBanner" id="turnBanner">
          <span>TURN</span>
          <strong id="turnText">—</strong>
          <small id="turnHint">Aim and flick</small>
        </section>

        <button id="turboButton" class="turboButton" type="button" aria-label="Hold to use turbo">
          <span class="turboGauge"><i id="turboFill"></i><b>⚡</b></span>
          <small id="turboState">CHARGING</small>
        </button>

        <div id="secondFlickStatus" class="secondFlickStatus" aria-label="Second flick status">
          <span class="secondFlickDisc">
            <svg class="secondFlickIcon" viewBox="0 0 100 100" aria-hidden="true">
              <path class="swipeArrow" d="M18 26 H69 M57 14 L69 26 L57 38"></path>
              <path class="swipeFinger" d="M42 72 V46 C42 41 45 38 49 38 C53 38 56 41 56 46 V58 M56 54 C56 50 59 47 63 47 C67 47 70 50 70 54 V61 M70 57 C70 53 73 50 77 50 C81 50 84 53 84 57 V69 C84 80 76 87 64 87 H54 C45 87 39 82 36 75 L31 62 C29 58 31 54 35 52 C39 51 42 53 44 57 L47 64"></path>
            </svg>
          </span>
          <small id="secondFlickText">AVAILABLE</small>
        </div>

        <div id="finishOverlay" class="finishOverlay hidden"></div>
      </div>

      <section id="scoreboard" class="scoreboard"></section>

      <div class="raceBottomBar">
        <button id="finishTurnButton" class="finishTurnButton" type="button" disabled>FINISH TURN</button>
      </div>
    </section>
  </main>
</div>

<script src="lan-core.js?v=8"></script>
<script src="disc-rally.js?v=40"></script>
</body>
</html>
