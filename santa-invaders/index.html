<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d8edf5">
<title>Santa Invaders · GameBox</title>
<link rel="stylesheet" href="style.css?v=4">
</head>
<body>
<main class="arcade" aria-label="Santa Invaders Christmas arcade">
  <div class="gameFrame">
    <header class="hud">
      <a class="iconButton" href="../" aria-label="Back to GameBox"><img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/home.png" alt=""></a>
      <div class="hudStat"><span>SCORE</span><strong id="score">000000</strong></div>
      <div class="hudStat hudWave"><span>WAVE</span><strong id="wave">01</strong></div>
      <div class="hudStat hudLives"><span>LIVES</span><strong id="lives">♥ ♥ ♥</strong></div>
      <button type="button" class="iconButton" id="menuButton" aria-label="Pause and settings"><img src="../assets/gamebox/kenney/icons/Game Icons/White/2x/gear.png" alt=""></button>
    </header>

    <section class="playfield" aria-label="Arcade playfield">
      <canvas id="game" width="360" height="600" aria-label="Move the snowman defender left and right. Fire snowballs at approaching Christmas monsters."></canvas>
      <div class="waveBanner" id="waveBanner" aria-live="polite"></div>
      <p id="assetStatus" class="assetStatus" aria-live="polite">Loading Christmas sprites…</p>
    </section>

    <nav class="controls" aria-label="Game controls">
      <button type="button" class="control move" id="moveLeft" aria-label="Move left"><span aria-hidden="true">◀</span></button>
      <button type="button" class="control move" id="moveRight" aria-label="Move right"><span aria-hidden="true">▶</span></button>
      <button type="button" class="control fire" id="fire" aria-label="Fire snowballs"><span class="snowballIcon" aria-hidden="true"></span><span>FIRE</span></button>
    </nav>

    <div id="overlay" class="overlay show" role="dialog" aria-modal="true" aria-labelledby="overlayTitle">
      <section class="menuCard">
        <div class="heroScene" aria-hidden="true"><canvas id="heroCanvas" width="312" height="112"></canvas></div>
        <p class="eyebrow">GAMEBOX CHRISTMAS</p>
        <h1 id="overlayTitle">SANTA <em>INVADERS</em></h1>
        <p id="overlayText" class="tagline">Defend the ice line against growing waves of Christmas monsters.</p>
        <div class="resultStrip" id="resultStrip" hidden><div>YOUR SCORE<strong id="endScore">0</strong></div><div>BEST<strong id="endBest">0</strong></div></div>
        <button type="button" id="primaryButton" class="kenneyButton primary" disabled>LOADING CHRISTMAS…</button>
        <button type="button" id="secondaryButton" class="kenneyButton secondary">HOW TO PLAY</button>
        <button type="button" id="soundButton" class="kenneyButton secondary soundButton">SOUND ON</button>
        <p id="controlsHint" class="controlHint">← → / A D to move · SPACE to throw<br>On phones: hold the arrows and FIRE</p>
        <a href="../" class="homeLink">← GAMEBOX</a>
      </section>
    </div>
    <div id="announce" class="srOnly" aria-live="polite"></div>
  </div>
</main>
<script src="game.js?v=6"></script>
</body>
</html>
