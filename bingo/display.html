<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#071e35"><title>BINGO IN! — Audience Board</title>
<style>
:root{color-scheme:dark;--navy:#071e35;--paper:#eff5ff;--gold:#f2bf35}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--paper);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Arial,sans-serif;background:radial-gradient(ellipse at 50% -20%,#164e7c,transparent 45%),#071e35}
.shell{width:min(1500px,calc(100% - 44px));margin:auto;padding:25px 0 35px}
.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.brand{font-weight:1000;font-size:clamp(26px,3.8vw,51px);letter-spacing:-.055em;line-height:1;color:var(--gold)}
.info{text-align:right}
.info strong{display:block;font-size:clamp(15px,2.5vw,28px)}
.info small{color:#bed1e0;letter-spacing:.05em;text-transform:uppercase;font-weight:750}
.stage{background:#0e3659;border:1px solid #ffffff2d;border-radius:20px;padding:17px;display:flex;gap:15px;align-items:center;justify-content:space-around;text-align:center}
.stage > div{flex:1;min-width:0}
.stage small{display:block;text-transform:uppercase;letter-spacing:.11em;color:#aec9df;font-size:clamp(10px,1.3vw,16px);font-weight:800}
.stage strong{display:block;font-size:clamp(19px,3.5vw,43px);line-height:1.2;margin-top:3px}
.layout{display:grid;grid-template-columns:minmax(240px,.8fr) minmax(400px,1.4fr);gap:24px;margin-top:26px}
.current{background:linear-gradient(160deg,#0e3557,#143f62);border-radius:24px;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px;min-height:350px}
.current .label{text-transform:uppercase;font-size:clamp(14px,2vw,23px);letter-spacing:.1em;font-weight:800;color:#bad5eb}
.ball{width:min(25vw,310px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 27% 20%,#fff8de,#edbe37 66%,#b27813);display:grid;place-items:center;font-size:clamp(80px,12vw,170px);font-weight:1000;line-height:1;color:#072a47;box-shadow:inset 0 -15px 25px #7b4a1729,0 19px 0 #896015,0 30px 40px #0005;margin:24px}
.calls{color:#eaf3ff;font-size:clamp(15px,2vw,24px);font-weight:750}
.boardCard{background:#0d304e;border:1px solid #ffffff1b;border-radius:23px;padding:24px;min-width:0}
.boardCard h2{margin:0 0 16px;font-size:clamp(20px,2.4vw,30px)}
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:clamp(3px,.7vw,10px)}
.number{aspect-ratio:1;border-radius:8px;border:1px solid #3b5e79;display:grid;place-items:center;color:#728ba2;background:#09233d;font-size:clamp(15px,2vw,30px);font-weight:900;font-variant-numeric:tabular-nums}
.number.called{background:#d8edf8;border-color:#f8f8ff;color:#092b47}
.number.last{background:#f4c640;color:#09263b;border-color:#ffe98b;box-shadow:0 0 0 3px #eab73144}
.footer{display:flex;justify-content:space-between;align-items:center;color:#a5c0d5;font-size:15px;margin-top:24px}
button{border:1px solid #7493ae;background:#0c2e4d;color:#fff;padding:9px 16px;border-radius:9px;font-weight:750;cursor:pointer}
#offline{font-weight:700;color:#ffd781}
@media(max-width:780px){.layout{grid-template-columns:1fr}.ball{width:185px;font-size:95px}.current{min-height:280px}.boardCard{padding:14px}.shell{width:calc(100% - 25px)}.number{font-size:clamp(11px,3vw,28px);border-radius:5px}.header{align-items:flex-start}.info strong{font-size:15px}}
</style>
</head>
<body><main class="shell">
<header class="header"><div class="brand">BINGO IN!</div><div class="info"><strong id="venue">Waiting for the host</strong><small id="eventName">Host controls are on the other screen</small></div></header>
<section class="stage" aria-label="Current game and prize"><div><small>Game</small><strong id="gameLabel">1 / 5</strong></div><div><small>Playing for</small><strong id="prizeLabel">1 Line</strong></div><div><small>Prize</small><strong id="potLabel">£0.00</strong></div></section>
<div class="layout"><section class="current"><span class="label">Last number</span><div class="ball" id="ball">—</div><div class="calls" id="callCount">Ready when you are</div></section>
<section class="boardCard"><h2>Numbers called</h2><div class="board" id="board" aria-label="Called number board"></div></section></div>
<footer class="footer"><span id="offline" role="status">Waiting for Bingo Master…</span><button id="fullscreen" type="button">Full screen</button></footer></main>
<script>
(()=>{'use strict';
const KEY='gamebox.bingo.public.v1';
const els={venue:document.getElementById('venue'),event:document.getElementById('eventName'),game:document.getElementById('gameLabel'),prize:document.getElementById('prizeLabel'),pot:document.getElementById('potLabel'),ball:document.getElementById('ball'),calls:document.getElementById('callCount'),board:document.getElementById('board'),status:document.getElementById('offline')};
const numbers=[];
for(let n=1;n<=90;n++){const d=document.createElement('div');d.className='number';d.textContent=n;els.board.appendChild(d);numbers.push(d)}
let lastStamp=0;
function render(data){
 if(!data||!Array.isArray(data.called))return;
 lastStamp=data.updatedAt||Date.now();
 els.venue.textContent=data.venue||'Bingo In!';
 els.event.textContent=data.title||'Hosted bingo';
 els.game.textContent=(data.game||1)+' / '+(data.gameCount||5);
 els.prize.textContent=data.stage||'1 Line';
 els.pot.textContent='£'+((data.stagePotPence||0)/100).toFixed(2);
 els.ball.textContent=data.number||'—';
 els.calls.textContent=data.finished?'Evening finished':data.called.length+' of 90 numbers called';
 els.status.textContent=data.finished?'Thanks for playing!':'Live from the Bingo Master';
 const called=new Set(data.called);
 numbers.forEach((el,i)=>{el.classList.toggle('called',called.has(i+1));el.classList.toggle('last',i+1===data.number)});
}
try{render(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{}
window.addEventListener('storage',e=>{if(e.key===KEY){try{render(JSON.parse(e.newValue||'null'))}catch{}}});
try{const bc=new BroadcastChannel('gamebox-bingo-public');bc.onmessage=e=>render(e.data)}catch{}
document.getElementById('fullscreen').onclick=()=>{
 if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();
 else document.exitFullscreen?.();
};
})();
</script>
</body></html>
