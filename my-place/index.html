<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171a3d">
<title>My Place · GameBox</title>
<style>
:root{
  --ink:#171a3d;--ink2:#30345f;--cream:#f3f4df;--paper:#fffced;
  --lav:#aaa3c8;--lav2:#8179aa;--gold:#efc24e;--mint:#5fa18f;--rose:#d86d7f;
  --ui:#11152d;--panel:#f7f1dd;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0c1024;font-family:ui-rounded,"SF Pro Rounded","Avenir Next",system-ui,sans-serif;color:var(--ink)}
button{font:inherit}
.game{height:100dvh;display:grid;grid-template-rows:auto 1fr auto;background:#0c1024}
.top{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 7px;background:#11152d;z-index:10}
.back{width:44px;height:44px;display:grid;place-items:center;text-decoration:none;color:#f7f1dd;background:#25294e;border:4px solid #080b1a;box-shadow:0 4px 0 #080b1a;font-size:24px;font-weight:1000}
.brand{color:#fff;min-width:0}
.brand small{display:block;font-size:9px;font-weight:1000;letter-spacing:.18em;color:#aaa3c8}
.brand h1{font-size:20px;margin:1px 0 0;line-height:1}
.wallet{height:44px;padding:0 12px;display:flex;gap:7px;align-items:center;background:#efc24e;border:4px solid #080b1a;box-shadow:0 4px 0 #080b1a;font-weight:1000;color:#3f3150}
.coin{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#fff4a1;border:3px solid #a46b24;font-size:10px}
.stageWrap{min-height:0;padding:5px 8px 0;display:grid;place-items:center}
.stage{position:relative;width:min(100%,840px);height:100%;max-height:680px;min-height:300px;overflow:hidden;background:#171a3d;border:5px solid #080b1a;box-shadow:0 12px 0 #080b1a}
#world{width:100%;height:100%;display:block;image-rendering:pixelated}
.hudPill{position:absolute;left:10px;top:10px;padding:6px 9px;background:#11152d;color:#f7f1dd;border:3px solid #080b1a;box-shadow:0 3px 0 #080b1a;font-size:10px;font-weight:1000;z-index:3}
.hudPill b{color:#efc24e}
.dogBubble{position:absolute;z-index:4;left:50%;top:14%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;background:#fffced;border:4px solid #171a3d;box-shadow:0 5px 0 #171a3d;padding:7px 10px;font-size:11px;font-weight:1000;transition:.18s}
.dogBubble.show{opacity:1;transform:translate(-50%,0)}
.bottom{padding:7px 8px calc(8px + env(safe-area-inset-bottom));background:#11152d;z-index:10}
.panel{max-width:840px;margin:0 auto;background:#f7f1dd;border:4px solid #080b1a;box-shadow:0 5px 0 #080b1a;padding:8px}
.focus{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:0 2px 8px}
.focus small{display:block;font-size:9px;font-weight:1000;letter-spacing:.12em;color:#8179aa}
.focus strong{display:block;font-size:17px;line-height:1.05;margin-top:2px}
.focus span{display:block;font-size:10px;color:#6c6880;font-weight:800;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upgrade{min-width:118px;border:4px solid #171a3d;background:#72b8a5;color:#112d2a;padding:8px 9px;box-shadow:0 4px 0 #171a3d;font-weight:1000;cursor:pointer}
.upgrade:active,.dock button:active,.back:active{transform:translateY(3px);box-shadow:none}
.upgrade.maxed{background:#c8c2b5;color:#666274}
.upgrade em{font-style:normal;display:block;font-size:9px;margin-top:1px}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.dock button{border:3px solid #171a3d;background:#e4dcc9;color:#655f76;padding:6px 2px 5px;box-shadow:0 3px 0 #171a3d;cursor:pointer;min-width:0}
.dock button.selected{background:#efc24e;color:#433650}
.dock svg{width:22px;height:22px;display:block;margin:0 auto 2px}
.dock span{display:block;font-size:8px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pixel{shape-rendering:crispEdges}
.item{transition:opacity .16s linear}
.flash{animation:flash .38s steps(2,end)}
@keyframes flash{0%{filter:brightness(1)}45%{filter:brightness(1.8)}100%{filter:brightness(1)}}
#dogTail{transform-box:fill-box;transform-origin:0 75%;animation:tailWag .8s steps(2,end) infinite}
#dogEyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s steps(1,end) infinite}
@keyframes tailWag{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}
@keyframes blink{0%,44%,47%,100%{transform:scaleY(1)}45%,46%{transform:scaleY(.08)}}
@media(max-height:660px){
 .top{padding-top:calc(5px + env(safe-area-inset-top));padding-bottom:4px}
 .top,.bottom{font-size:12px}.back,.wallet{height:38px}.back{width:38px}.top{grid-template-columns:38px 1fr auto}
 .brand h1{font-size:17px}.panel{padding:6px}.focus{padding-bottom:5px}.dock button{padding:4px 1px}.dock svg{width:18px;height:18px}
}
@media(orientation:landscape) and (max-height:520px){
 .game{grid-template-columns:1fr 310px;grid-template-rows:auto 1fr}.top{grid-column:1/3}.stageWrap{grid-column:1;grid-row:2}.bottom{grid-column:2;grid-row:2;display:grid;align-items:center;padding:5px}.dock{grid-template-columns:repeat(3,1fr)}.stage{max-height:none}
}
@media(prefers-reduced-motion:reduce){#dogTail,#dogEyes{animation:none}}
</style>

              <!-- neck -->
              <path d="M44 77h36v55H59v11H38v-18H28V96h10V84h6z" fill="#171a3d"/>

              <!-- side-profile head outline -->
              <path d="M10 30h16V17h19V8h42v8h19v12h13v12h14v34h-12v15h-18v11H52v-8H29V82H14V70H3V42h7z" fill="#171a3d"/>

              <path d="M75 18h31v10h14v17h12v34h-10v17H95V84H84V53h-9z" fill="#171a3d"/>

              <path d="M16 55h18v21h19v17H34V84H20V75H10V61h6z" fill="#aaa3c8"/>

  </main>

  <footer class="bottom">
    <div class="panel">
      <div class="focus">
        <div>
          <small id="category">ROOM · LV. 1</small>
          <strong id="upgradeName">Starter Room</strong>
          <span id="upgradeDesc">A tiny place with plenty of potential.</span>
        </div>
        <button class="upgrade" id="upgradeBtn">UPGRADE<em>∞ COINS</em></button>
      </div>
      <nav class="dock" id="dock"></nav>
    </div>
  </footer>
</div>

<script>
const paths={
 room:{label:'Room',icon:'home',stages:[
  ['Starter Room','A tiny place with plenty of potential.'],
  ['Fresh Paint','Warmer walls and cleaner flooring.'],
  ['Sage Studio','A calmer palette and smarter floor finish.'],
  ['Soft Luxe','Lavender walls and darker timber.'],
  ['Midnight Suite','A dramatic premium finish.']
 ]},
 sofa:{label:'Lounge',icon:'sofa',stages:[
  ['Second-Hand Sofa','It has seen some things.'],
  ['Comfy Sofa','Softer fabric and brighter cushions.'],
  ['Statement Sofa','A bolder colour combination.'],
  ['Designer Sofa','Deep upholstery and gold accents.'],
  ['Signature Sofa','The centrepiece of the room.']
 ]},
 bed:{label:'Sleep',icon:'bed',stages:[
  ['Basic Bed','Simple frame, simple bedding.'],
  ['Fresh Bedding','Brighter linen and a better frame.'],
  ['Hotel Bed','Soft sage with clean white pillows.'],
  ['Boutique Bed','Rich lavender with a padded headboard.'],
  ['Dream Bed','Dark frame and gold bedding.']
 ]},
 table:{label:'Furniture',icon:'table',stages:[
  ['Old Table','A basic little coffee table.'],
  ['Warm Timber','A tidier wood finish.'],
  ['Modern Table','A lighter top and slimmer legs.'],
  ['Stone Table','Pale stone with dark supports.'],
  ['Designer Table','Dark top with gold legs.']
 ]},
 plant:{label:'Decor',icon:'plant',stages:[
  ['Small Plant','A little green in the corner.'],
  ['Healthier Plant','Brighter foliage and a nicer pot.'],
  ['Big Plant','More leaves, more presence.'],
  ['Statement Plant','Deep green with a cool planter.'],
  ['Living Feature','Premium planter and lush foliage.']
 ]},
 pet:{label:'Pet',icon:'pet',stages:[
  ['Little Friend','He has already made himself at home.'],
  ['New Collar','A bright collar and tag.'],
  ['Bandana','Now he knows he looks good.'],
  ['Harness','Ready for important adventures.'],
  ['Tiny Royalty','Completely spoiled. As intended.']
 ]}
};
const state={room:0,sofa:0,bed:0,table:0,plant:0,pet:0};
let selected='room';

function icon(name){
 const d={
  home:'<path d="M5 14 16 5l11 9v13H5z"/><path d="M12 27v-8h8v8"/>',
  sofa:'<path d="M7 16v-3a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v3"/><path d="M5 16a3 3 0 0 1 3 3v4h16v-4a3 3 0 0 1 3-3v11H5z"/>',
  bed:'<path d="M5 8v19M27 15v12M5 21h22"/><path d="M8 13h7a4 4 0 0 1 4 4v4H8z"/>',
  table:'<rect x="6" y="8" width="20" height="7"/><path d="M10 15v12M22 15v12"/>',
  plant:'<path d="M16 18v-9M16 14c-5 0-8-3-8-7 5 0 8 2 8 7M16 12c5 0 8-3 8-7-5 0-8 2-8 7"/><path d="M9 19h14l-2 8H11z"/>',
  pet:'<path d="M8 10 5 5l7 2M24 10l3-5-7 2"/><path d="M9 10c-3 4-3 11 1 15 3 3 9 3 12 0 4-4 4-11 1-15"/><circle cx="12" cy="16" r="1"/><circle cx="20" cy="16" r="1"/>'
 }[name];
 return '<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">'+d+'</svg>';
}
function buildDock(){
 const dock=document.getElementById('dock');
 dock.innerHTML=Object.keys(paths).map(function(k){
  return '<button data-k="'+k+'" class="'+(k===selected?'selected':'')+'">'+icon(paths[k].icon)+'<span>'+paths[k].label+'</span></button>';
 }).join('');
 dock.querySelectorAll('button').forEach(function(b){
  b.onclick=function(){selected=b.dataset.k;buildDock();syncFocus()};
 });
}
function syncFocus(){
 const p=paths[selected],l=state[selected];
 document.getElementById('category').textContent=p.label.toUpperCase()+' · LV. '+(l+1);
 document.getElementById('upgradeName').textContent=p.stages[l][0];
 document.getElementById('upgradeDesc').textContent=p.stages[l][1];
 const btn=document.getElementById('upgradeBtn');
 if(l>=4){btn.classList.add('maxed');btn.innerHTML='MAX LEVEL<em>COMPLETE</em>'}
 else{btn.classList.remove('maxed');btn.innerHTML='UPGRADE<em>∞ COINS</em>'}
 const total=Object.values(state).reduce(function(a,b){return a+b},0);
 document.getElementById('homeLevel').textContent='LV. '+(1+Math.floor(total/3));
}
function fill(id,v){const e=document.getElementById(id);if(e)e.setAttribute('fill',v)}
function applyRoom(){
 const l=state.room;
 const walls=['#cfc7dc','#eadfc8','#c8d9cf','#c8bddb','#31385c'];
 const floors=['#9d775a','#bd875b','#b49376','#71584d','#4c3b45'];
 fill('wall',walls[l]);fill('floor',floors[l]);
 document.getElementById('floorLines').setAttribute('stroke',l===4?'#2f2837':'#6f4e3e');
}
function applySofa(){
 const l=state.sofa;
 const pal=[
  ['#756e92','#8f87ac','#67607f','#d8a2aa','#f0d479'],
  ['#9b796c','#bd9682','#866557','#f1d7b4','#d88975'],
  ['#5f8c87','#78a69f','#4a716e','#efd172','#f3efe0'],
  ['#65557e','#816d9d','#514364','#d99aae','#efc24e'],
  ['#314e59','#426773','#233943','#e7ded0','#efc24e']
 ][l];
 fill('sofaBack',pal[0]);fill('sofaSeat',pal[1]);fill('sofaArmL',pal[2]);fill('sofaArmR',pal[2]);fill('cushion1',pal[3]);fill('cushion2',pal[4]);
}
function applyBed(){
 const l=state.bed;
 const p=[
  ['#6d5572','#684c4d','#aaa3c8','#fffced'],
  ['#8c694f','#805a45','#86a2b0','#fffced'],
  ['#697a70','#6a5d50','#7d9d8d','#ffffff'],
  ['#6c587a','#57465e','#a77b96','#f6e7e5'],
  ['#28394e','#26313f','#d4aa4f','#ffffff']
 ][l];
 fill('bedHead',p[0]);fill('bedFrame',p[1]);fill('duvet',p[2]);fill('pillow',p[3]);
}
function applyTable(){
 const l=state.table;
 const tops=['#9f7658','#b98458','#869093','#d7d0c0','#303744'];
 const legs=['#171a3d','#171a3d','#4f5962','#303744','#b78b43'];
 document.querySelector('#tableTop+rect').setAttribute('fill',tops[l]);
 fill('tableLegL',legs[l]);fill('tableLegR',legs[l]);
}
function applyPlant(){
 const l=state.plant;
 const leaves=['#5fa18f','#559b72','#4d8e68','#39755c','#2c6e58'];
 const pots=['#aa735d','#c48662','#c5ab77','#657a85','#c59047'];
 document.getElementById('plantLeaves').setAttribute('fill',leaves[l]);fill('plantPot',pots[l]);
 const scale=1+l*.025;document.getElementById('plant').setAttribute('transform','translate('+(864*(1-scale))+','+(388*(1-scale))+') scale('+scale+')');
}
function applyPet(){
 const l=state.pet;
 document.getElementById('petCollar').setAttribute('opacity',l>=1?'1':'0');
 document.getElementById('petBandana').setAttribute('opacity',l>=2?'1':'0');
 document.getElementById('petHarness').setAttribute('opacity',l>=3?'1':'0');
 document.getElementById('petCrown').setAttribute('opacity',l>=4?'1':'0');
 fill('collar',l>=4?'#8d65b0':l>=3?'#5fa18f':l>=2?'#6f91c5':'#d86d7f');
 fill('tag',l>=4?'#fff1a6':'#efc24e');
}
function applyAll(){applyRoom();applySofa();applyBed();applyTable();applyPlant();applyPet();syncFocus()}
function flash(id){
 const e=document.getElementById(id);if(!e)return;e.classList.remove('flash');void e.getBBox();e.classList.add('flash')
}
document.getElementById('upgradeBtn').onclick=function(){
 if(state[selected]>=4)return;
 state[selected]++;
 applyAll();
 flash(selected==='room'?'world':selected);
 const b=document.getElementById('bubble');
 b.textContent=selected==='pet'?'Looking fancy!':'Nice upgrade!';
 b.classList.add('show');setTimeout(function(){b.classList.remove('show')},850);
 if(navigator.vibrate)navigator.vibrate(20);
};

/* dog wandering: side-profile quadruped gait with planted diagonal pairs */
const mover=document.getElementById('dogMover');
const facing=document.getElementById('dogFacing');
const frontNear=document.getElementById('legFrontNear');
const frontFar=document.getElementById('legFrontFar');
const backNear=document.getElementById('legBackNear');
const backFar=document.getElementById('legBackFar');
const dogTail=document.getElementById('dogTail');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

const spots=[
 {x:330,y:430},{x:410,y:438},{x:500,y:428},{x:585,y:442},
 {x:675,y:430},{x:720,y:446},{x:610,y:458},{x:470,y:454},{x:365,y:458}
];
let pos={x:338,y:430},from={x:338,y:430},to={x:500,y:428};
let moveStart=performance.now(),duration=2500,restUntil=0,walking=true;
let direction=1,lastBubble=0;

function setFacing(dir){
 direction=dir;
 facing.setAttribute('transform',dir<0?'translate(150 0) scale(-.74 .74)':'scale(.74)');
}
function chooseNext(now){
 const choices=spots.filter(function(s){return Math.abs(s.x-pos.x)+Math.abs(s.y-pos.y)>85});
 to=choices[Math.floor(Math.random()*choices.length)];
 from={x:pos.x,y:pos.y};
 moveStart=now;
 const dist=Math.hypot(to.x-from.x,to.y-from.y);
 duration=1700+dist*5.2;
 walking=true;
 setFacing(to.x<from.x?-1:1);
}
function gait(phase){
 /* diagonal pairs alternate: front-near + rear-far, then front-far + rear-near */
 const a=Math.sin(phase*Math.PI*2);
 const b=-a;
 const liftA=Math.max(0,a)*5, liftB=Math.max(0,b)*5;
 const strideA=a*4, strideB=b*4;
 frontNear.setAttribute('transform','translate('+strideA+' '+(-liftA)+')');
 backFar.setAttribute('transform','translate('+strideA+' '+(-liftA)+')');
 frontFar.setAttribute('transform','translate('+strideB+' '+(-liftB)+')');
 backNear.setAttribute('transform','translate('+strideB+' '+(-liftB)+')');
}
function stand(){
 frontNear.removeAttribute('transform');frontFar.removeAttribute('transform');
 backNear.removeAttribute('transform');backFar.removeAttribute('transform');
}
function maybeBubble(now){
 if(now-lastBubble<5000||Math.random()>.24)return;
 lastBubble=now;
 const b=document.getElementById('bubble');
 const lines=['sniff sniff','woof!','comfy.','hmm...'];
 b.textContent=lines[Math.floor(Math.random()*lines.length)];
 b.classList.add('show');setTimeout(function(){b.classList.remove('show')},700);
}
function tick(now){
 if(reduced){
   mover.setAttribute('transform','translate(510 438)');
   setFacing(1);stand();requestAnimationFrame(tick);return;
 }
 if(!walking){
   stand();
   /* subtle four-legged idle: body stays planted; only tiny head-level breathing impression */
   mover.setAttribute('transform','translate('+pos.x+' '+(pos.y+Math.sin(now/420)*.6)+')');
   maybeBubble(now);
   if(now>=restUntil)chooseNext(now);
 }else{
   const t=Math.min(1,(now-moveStart)/duration);
   const eased=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
   pos.x=from.x+(to.x-from.x)*eased;
   pos.y=from.y+(to.y-from.y)*eased;
   const cycles=Math.max(2,Math.hypot(to.x-from.x,to.y-from.y)/62);
   const phase=t*cycles;
   gait(phase);
   /* almost no vertical body bounce: dogs move through the legs, not like hopping bipeds */
   const bodyRise=Math.abs(Math.sin(phase*Math.PI*2))*.7;
   mover.setAttribute('transform','translate('+pos.x+' '+(pos.y-bodyRise)+')');
   if(t>=1){
     pos={x:to.x,y:to.y};
     walking=false;
     restUntil=now+1100+Math.random()*2300;
     stand();
   }
 }
 requestAnimationFrame(tick);
}
setFacing(1);
requestAnimationFrame(tick);

buildDock();applyAll();
</script>
