<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171426">
<title>My Place · GameBox</title>
<style>
:root{
  --ink:#171426;--black:#090812;--deep:#242039;--navy:#303653;--slate:#52617a;
  --paper:#f7f2df;--cream:#ead8b6;--gold:#f2bd4f;--yellow:#ffe37a;
  --mint:#79ad72;--teal:#3e847e;--rose:#d26a86;--rust:#c65348
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#090812;color:var(--paper);font-family:"Courier New",ui-monospace,monospace;font-weight:900}
button{font:inherit}
button,a{-webkit-tap-highlight-color:transparent}
.game{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;background:#090812}
.top{
 display:grid;grid-template-columns:58px minmax(0,1fr) auto 58px;gap:6px;align-items:center;
 padding:calc(7px + env(safe-area-inset-top)) 7px 8px;
 background:
   linear-gradient(90deg,rgba(255,255,255,.025) 50%,transparent 50%) 0 0/8px 8px,
   linear-gradient(#242039,#171426);
 border-bottom:4px solid var(--black);box-shadow:inset 0 -2px #303653;z-index:5
}
.pxButton{
 position:relative;min-height:42px;border:0;color:var(--paper);background:#303653;
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
 box-shadow:inset 0 3px #52617a,inset 3px 0 #52617a,inset 0 -4px #0d0b18,inset -3px 0 #0d0b18;
 cursor:pointer;text-transform:uppercase;letter-spacing:.06em;font-size:9px
}
.pxButton:after{content:"";position:absolute;left:4px;right:4px;top:4px;height:2px;background:rgba(255,255,255,.12);pointer-events:none}
.pxButton:active,.upgrade:active,.dock button:active{transform:translateY(2px)}
.back,.reset{display:grid;place-items:center;text-decoration:none;width:58px;height:42px}
.brand{min-width:0;color:var(--paper);text-shadow:2px 2px 0 var(--black)}
.brand small{display:block;color:#a99cc1;font-size:7px;line-height:1;letter-spacing:.15em}
.brand h1{margin:3px 0 0;font-size:19px;line-height:.95;letter-spacing:.05em;text-transform:uppercase}
.wallet{
 height:42px;padding:0 9px;display:flex;align-items:center;gap:6px;
 color:#35251f;background:var(--gold);
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
 box-shadow:inset 0 3px var(--yellow),inset 3px 0 #ffd86a,inset 0 -4px #9b6430,inset -3px 0 #9b6430;
 font-size:13px;text-shadow:1px 1px rgba(255,255,255,.2)
}
.coin{
 width:19px;height:19px;display:grid;place-items:center;background:#ffe37a;color:#6f4427;
 clip-path:polygon(4px 0,15px 0,19px 4px,19px 15px,15px 19px,4px 19px,0 15px,0 4px);
 box-shadow:inset 0 0 0 3px #a76c2d;font-size:8px
}
.stageWrap{min-height:0;display:grid;place-items:center;padding:7px;background:#111020;overflow:hidden}
.stage{position:relative;width:100%;height:100%;min-height:0;display:grid;place-items:end center;overflow:hidden;padding-bottom:8px}
#world{
 display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#242039;
 max-width:100%;max-height:100%;
 box-shadow:0 0 0 3px #52617a,0 0 0 7px #090812,0 9px 0 7px #090812
}
.hud{
 position:absolute;left:max(12px,calc((100% - 720px)/2 + 12px));top:11px;padding:5px 7px 6px;
 background:#171426;color:var(--paper);
 clip-path:polygon(3px 0,calc(100% - 3px) 0,100% 3px,100% calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,0 calc(100% - 3px),0 3px);
 box-shadow:inset 0 2px #52617a,inset 2px 0 #52617a,inset 0 -3px #090812,inset -2px 0 #090812;
 font-size:8px;letter-spacing:.08em;pointer-events:none;text-shadow:1px 1px var(--black)
}
.hud b{color:var(--gold)}
.bottom{
 padding:7px 7px calc(8px + env(safe-area-inset-bottom));
 background:
   linear-gradient(90deg,rgba(255,255,255,.02) 50%,transparent 50%) 0 0/8px 8px,
   #171426;
 border-top:4px solid #090812;box-shadow:inset 0 2px #303653;z-index:5
}
.panel{max-width:760px;margin:0 auto;background:#242039;padding:7px;box-shadow:inset 0 0 0 3px #090812,inset 0 0 0 5px #52617a}
.focus{
 display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;
 padding:7px 7px 9px;background:#171426;box-shadow:inset 0 0 0 2px #090812;margin-bottom:6px
}
.focus small{display:block;color:#a99cc1;font-size:7px;letter-spacing:.14em;text-transform:uppercase}
.focus strong{display:block;color:var(--paper);font-size:14px;line-height:1;margin-top:3px;text-transform:uppercase;text-shadow:2px 2px #090812}
.focus span{display:block;font-size:8px;color:#bdb3ca;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.upgrade{
 position:relative;min-width:116px;border:0;background:var(--mint);color:#112e25;padding:9px 9px 11px;cursor:pointer;
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
 box-shadow:inset 0 3px #a7cf93,inset 3px 0 #95c184,inset 0 -4px #346451,inset -3px 0 #346451;
 text-transform:uppercase;font-size:10px;letter-spacing:.04em;text-shadow:1px 1px rgba(255,255,255,.2)
}
.upgrade:before{content:"";position:absolute;inset:4px;border:1px dashed rgba(23,20,38,.3);pointer-events:none}
.upgrade em{font-style:normal;display:block;font-size:7px;margin-top:3px;letter-spacing:.08em}
.upgrade.maxed{background:#6b6875;color:#c9c3ca;box-shadow:inset 0 3px #898492,inset 0 -4px #35323f}
.dock{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.dock button{
 position:relative;min-width:0;height:57px;border:0;background:#303653;color:#d7cfdb;padding:5px 1px 6px;cursor:pointer;
 clip-path:polygon(4px 0,calc(100% - 4px) 0,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0 calc(100% - 4px),0 4px);
 box-shadow:inset 0 3px #52617a,inset 3px 0 #52617a,inset 0 -4px #0d0b18,inset -3px 0 #0d0b18
}
.dock button:before{content:"";position:absolute;left:5px;right:5px;top:4px;height:2px;background:rgba(255,255,255,.09)}
.dock button.selected{
 background:var(--gold);color:#35251f;
 box-shadow:inset 0 3px var(--yellow),inset 3px 0 #ffd86a,inset 0 -4px #9b6430,inset -3px 0 #9b6430
}
.dockIcon{width:28px;height:28px;display:block;margin:0 auto 1px;image-rendering:pixelated;image-rendering:crisp-edges}
.dock span{display:block;font-size:7px;line-height:1;font-weight:900;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:390px){.dock{gap:3px}.dock button{height:53px}.dockIcon{width:24px;height:24px}.dock span{font-size:6px}.top{grid-template-columns:52px minmax(0,1fr) auto 52px}.back,.reset{width:52px}}
@media(max-height:690px){
 .top{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:5px}.pxButton,.wallet{height:36px;min-height:36px}
 .brand h1{font-size:16px}.bottom{padding-top:5px}.panel{padding:5px}.focus{padding:5px 6px 7px;margin-bottom:4px}.dock button{height:49px;padding-top:3px}.dockIcon{width:22px;height:22px}
}
@media(orientation:landscape) and (max-height:520px){
 .game{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto minmax(0,1fr)}.top{grid-column:1/3}.stageWrap{grid-column:1;grid-row:2}.bottom{grid-column:2;grid-row:2;padding:5px;display:grid;align-items:center}
 .dock{grid-template-columns:repeat(3,1fr)}.dock button{height:51px}.focus{grid-template-columns:1fr}.upgrade{width:100%}
}
</style>
</head>
<body>
<div class="game">
  <header class="top">
    <a class="back pxButton" href="../" aria-label="Back to GameBox">BACK</a>
    <div class="brand"><small>GAMEBOX PIXEL WORLD</small><h1>My Place</h1></div>
    <div class="wallet"><span class="coin">C</span><span>∞</span></div>
    <button class="reset pxButton" id="reset" type="button" aria-label="Reset upgrades">RESET</button>
  </header>

  <main class="stageWrap" id="stageWrap">
    <div class="stage">
      <canvas id="world" width="352" height="220" aria-label="Animated code-generated pixel-art home with a walking person and dog"></canvas>
      <div class="hud">HOME <b id="homeLevel">LV. 1</b></div>
    </div>
  </main>

  <footer class="bottom">
    <div class="panel">
      <div class="focus">
        <div><small id="category">ROOM · LV. 1</small><strong id="upgradeName">Starter Room</strong><span id="upgradeDesc">A tiny place with plenty of potential.</span></div>
        <button class="upgrade" id="upgradeBtn" type="button">UPGRADE<em>∞ COINS</em></button>
      </div>
      <nav class="dock" id="dock" aria-label="Upgrade categories"></nav>
    </div>
  </footer>
</div>
<script src="../shared/gamebox-pixel-art.js?v=2"></script>
<script>
'use strict';
const {Grid,PixelStage,PAL,mix,alpha,hash2,bayer,ramp,clamp}=window.GBPixel;
const INK=PAL.ink;
const canvas=document.getElementById('world');
const stage=new PixelStage(canvas,352,220,document.getElementById('stageWrap'));
const ctx=stage.ctx;
ctx.imageSmoothingEnabled=false;

const paths={
 room:{label:'Room',icon:'home',stages:[['Starter Room','A tiny place with plenty of potential.'],['Fresh Paint','Warm plaster and cleaner timber.'],['Sage Studio','A calmer palette with richer floor detail.'],['Soft Luxe','Lavender walls and premium finishes.'],['Midnight Suite','A dramatic room with warm gold light.']]},
 sofa:{label:'Lounge',icon:'sofa',stages:[['Second-Hand Sofa','Comfortable enough, with a patch or two.'],['Comfy Sofa','Deeper cushions and tidier upholstery.'],['Statement Sofa','A bolder shape and brighter cushions.'],['Designer Sofa','Tailored seams, richer fabric and trim.'],['Signature Sofa','The room finally has a centrepiece.']]},
 bed:{label:'Sleep',icon:'bed',stages:[['Basic Bed','Simple frame, simple bedding.'],['Fresh Bedding','Cleaner linen and a stronger frame.'],['Hotel Bed','Layered pillows and a softer duvet.'],['Boutique Bed','Padded headboard and stitched covers.'],['Dream Bed','Dark timber, gold throw and perfect pillows.']]},
 table:{label:'Furniture',icon:'table',stages:[['Old Table','A sturdy little coffee table.'],['Warm Timber','Smoothed edges and richer grain.'],['Modern Table','Lighter top and slimmer supports.'],['Stone Table','Pale stone with a dark underframe.'],['Designer Table','Dark top, gold feet and shelf styling.']]},
 plant:{label:'Decor',icon:'plant',stages:[['Small Plant','A little green in the corner.'],['Healthier Plant','More leaves and a better pot.'],['Big Plant','Fuller foliage with layered shadows.'],['Statement Plant','Deep green leaves and a cool planter.'],['Living Feature','A lush indoor tree in a premium pot.']]},
 pet:{label:'Pet',icon:'pet',stages:[['Little Friend','A four-legged housemate with places to sniff.'],['New Collar','A bright collar and little gold tag.'],['Bandana','Now he knows he looks good.'],['Harness','Ready for important adventures.'],['Tiny Royalty','Completely spoiled. As intended.']]}
};
const state={room:0,sofa:0,bed:0,table:0,plant:0,pet:0};
let selected='room';
try{const saved=JSON.parse(localStorage.getItem('gamebox_my_place_v2')||'null');if(saved)for(const k of Object.keys(state))state[k]=clamp(Number(saved[k])||0,0,4)}catch(_e){}
const save=()=>{try{localStorage.setItem('gamebox_my_place_v2',JSON.stringify(state))}catch(_e){}};

const ICON_ROWS={
 home:[
  '.......K........','......KKK.......','.....KYYYK......','....KYYYYYK.....','...KYYYYYYYK....','..KYYYYYYYYYK...','.KYYYYYYYYYYYK..',
  'KKKKKKKKKKKKKKK','..KWWWWWWWWWK...','..KWWKKKWWWWK...','..KWWK.KWWWWK...','..KWWK.KWWWWK...','..KWWK.KWWWWK...','..KKKKKKKKKKK...'
 ],
 sofa:[
  '................','................','...KKKKKKKKKK...','..KTTTTTTTTTTK..','..KTTTTTTTTTTK..','..KTTTTTTTTTTK..',
  '.KKKKKKKKKKKKKK.','KRRKRRRRRRRRKRRK','KRRKRRRRRRRRKRRK','KRRKRRRRRRRRKRRK','KRRKKKKKKKKKKRRK','KKKK........KKKK',
  '..KK..........KK','................'
 ],
 bed:[
  '................','KK..............','KWWWWWWWWWWWWK..','KWWWWWWWWWWWWK..','KWWWWWWWWWWWWK..','KWWRRRRRRRRRRRK.',
  'KWWRRRRRRRRRRRK.','KWWRRRRRRRRRRRK.','KWWRRRRRRRRRRRK.','KKKKKKKKKKKKKKK.','K............K..','K............K..','K............K..','................'
 ],
 table:[
  '................','................','....KKKKKKKK....','...KYYYYYYYYK...','..KYYYYYYYYYYK..','..KKKKKKKKKKKK..',
  '....KK....KK....','....KK....KK....','....KK....KK....','....KK....KK....','...KKK....KKK...','................','................','................'
 ],
 plant:[
  '.......TT.......','....TTTTTT......','...TTTTTTTT.....','......TTTTTT....','..TTTTTTTTTT....','...TTTTTTTT.....',
  '.....TTTT.......','.......KK.......','......KYYK......','.....KYYYYK.....','.....KYYYYK.....','......KKKK......','................','................'
 ],
 pet:[
  '................','..KK.......KK...','..KWWK.....KWWK..','...KWWKKKKKWWK..','..KWWWWWWWWWWK..','.KWWKWWWWWWKWWK.',
  '.KWWWWWWWWWWWWK','..KWWWWWWWWWWK..','...KWWKKKKWWK...','....KKKYYKKK....','.....KYYYYK.....','.....K.KK.K.....','....KK....KK....','................'
 ]
};
function paintDockIcon(canvas,name,selected){
 canvas.width=16;canvas.height=14;
 const g=new Grid(16,14);
 g.stamp(ICON_ROWS[name]||ICON_ROWS.home,{
  K:INK,W:selected?'#fffdf2':PAL.paper,Y:selected?'#35251f':PAL.gold,
  T:selected?'#24524e':PAL.teal,R:selected?'#813f4f':PAL.rose
 });
 const x=canvas.getContext('2d');x.imageSmoothingEnabled=false;x.clearRect(0,0,16,14);x.drawImage(g.toCanvas(),0,0);
}
function buildDock(){
 const dock=document.getElementById('dock');
 dock.innerHTML=Object.keys(paths).map(k=>'<button type="button" data-k="'+k+'" class="'+(k===selected?'selected':'')+'"><canvas class="dockIcon" data-icon="'+paths[k].icon+'" aria-hidden="true"></canvas><span>'+paths[k].label+'</span></button>').join('');
 dock.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.k;buildDock();syncFocus()}));
 dock.querySelectorAll('.dockIcon').forEach(c=>paintDockIcon(c,c.dataset.icon,c.closest('button').classList.contains('selected')));
}
function syncFocus(){
 const p=paths[selected],l=state[selected];document.getElementById('category').textContent=p.label.toUpperCase()+' · LV. '+(l+1);document.getElementById('upgradeName').textContent=p.stages[l][0];document.getElementById('upgradeDesc').textContent=p.stages[l][1];
 const btn=document.getElementById('upgradeBtn');if(l>=4){btn.classList.add('maxed');btn.innerHTML='MAX LEVEL<em>COMPLETE</em>'}else{btn.classList.remove('maxed');btn.innerHTML='UPGRADE<em>∞ COINS</em>'}
 const total=Object.values(state).reduce((a,b)=>a+b,0);document.getElementById('homeLevel').textContent='LV. '+(1+Math.floor(total/3));
}

/* ---------- pixel asset factory: every image is generated from code ---------- */
const caches={room:new Map(),sofa:new Map(),bed:new Map(),table:new Map(),plant:new Map(),avatar:new Map(),dog:new Map()};
function cached(group,key,fn){const c=caches[group];if(!c.has(key))c.set(key,fn().toCanvas());return c.get(key)}

const ROOM_PALS=[
 {wall:['#a99bb4','#c7b9c7','#ddcfd1','#eee4d5'],floor:['#563b38','#775142','#9a6849','#bd8154'],trim:'#ead8b6',accent:'#9a86b8'},
 {wall:['#a89078','#c3a58a','#dac0a1','#f0dec0'],floor:['#5f4034','#86543b','#aa6c44','#ce8a53'],trim:'#f7e7c9',accent:'#c65348'},
 {wall:['#718678','#8da08c','#afbea5','#d8d5b4'],floor:['#5c4438','#7e5d49','#9c765a','#c39970'],trim:'#f1e6cf',accent:'#3e847e'},
 {wall:['#75677f','#9381a0','#b19eb8','#d8c6d0'],floor:['#45343a','#68494c','#886259','#ad7e68'],trim:'#f2e3d2',accent:'#d26a86'},
 {wall:['#20243a','#303653','#46536c','#65728b'],floor:['#2b252f','#40313a','#59413e','#775747'],trim:'#d8c69a',accent:'#f2bd4f'}
];
function roomCanvas(level){return cached('room',String(level),()=>{
 const g=new Grid(352,220),p=ROOM_PALS[level];
 g.rect(0,0,352,220,PAL.deepest);
 // rear wall with deterministic plaster flecks and a soft top-left light bias
 for(let y=0;y<88;y++)for(let x=0;x<352;x++){
   let t=.62 + (1-y/88)*.11 + (hash2(x>>2,y>>2,19)-.5)*.11;
   if(((x+y*3)%29)===0)t-=.14;
   g.set(x,y,ramp(p.wall,t,x,y,.45));
 }
 g.hline(0,351,0,p.wall[3]);g.hline(0,351,1,p.wall[2]);
 // picture rail and baseboard
 g.rect(0,76,352,3,mix(p.trim,INK,.28));g.hline(0,351,76,p.trim);
 g.rect(0,84,352,5,INK);g.hline(0,351,84,mix(p.trim,INK,.12));g.hline(0,351,85,p.trim);
 // timber floor, rows offset like real boards
 for(let y=89;y<220;y++){
   const row=Math.floor((y-89)/12),ly=(y-89)%12,off=(row%2)*29;
   for(let x=0;x<352;x++){
     const lx=(x+off)%58;let t=.53 + (hash2(x>>1,row,41)-.5)*.14 + (ly<2?.16:0) - (ly>9?.15:0);
     if(lx===0||lx===1)t-=.25;
     if((x*7+y*3)%67===0)t-=.1;
     g.set(x,y,ramp(p.floor,t,x,y,.38));
   }
 }
 // room corners / vignette edge pixels
 g.rect(0,0,3,220,INK);g.rect(349,0,3,220,INK);g.rect(0,217,352,3,INK);
 // rug underlay and shadow, woven at world level so it can sit below dog/table
 const rugCols=level>=4?['#312d45','#55466e','#8a6e82','#d6b86b']:level>=3?['#5d4767','#826884','#b498a7','#e8d5c6']:['#655c79','#83799a','#a99ab8','#d9cdd5'];
 g.rect(111,143,132,57,alpha(INK,.6));g.rect(114,140,126,56,(x,y)=>{
   const border=x<118||x>235||y<144||y>191; if(border)return rugCols[0];
   const band=((x+y)%8<4); return band?rugCols[2]:rugCols[1];
 });
 for(let x=118;x<236;x+=8){g.rect(x,145,3,2,rugCols[3]);g.rect(x+3,187,3,2,rugCols[0])}
 // wall shelf and tiny lived-in objects
 g.rect(118,30,85,3,INK);g.rect(120,28,81,2,mix(PAL.wood,PAL.cream,.25));
 g.rect(128,19,8,9,PAL.rust);g.rect(139,16,7,12,PAL.gold);g.rect(151,20,10,8,PAL.sky);g.rect(165,13,4,15,PAL.green);g.rect(171,18,13,10,PAL.lavender);g.rect(187,15,6,13,PAL.paper);
 // framed art, with actual tiny scene
 g.rect(70,15,39,34,INK);g.rect(73,18,33,28,PAL.sand);g.rect(75,20,29,24,'#86c0c9');g.rect(75,33,29,11,'#5f9564');g.poly([[75,34],[86,24],[96,34]],'#52617a');g.poly([[89,34],[99,27],[104,34]],'#303653');g.rect(82,38,4,5,PAL.rust);g.rect(97,37,3,6,PAL.gold);
 return g;
})}

function windowCanvas(level){return cached('room','window|'+level,()=>{
 const g=new Grid(94,59);const night=level>=4;
 g.rect(0,0,94,59,INK);g.rect(3,3,88,52,night?'#243052':'#71b5c9');
 // sky gradient bands
 for(let y=4;y<34;y++)g.hline(4,89,y,night?mix('#26385b','#563c67',y/34):mix('#9ddbe0','#63a9c2',y/34));
 // moon/sun and clouds
 if(night){g.ellipse(75,14,7,7,PAL.cream);g.ellipse(78,12,6,6,'#26385b');for(const p of [[18,11],[39,7],[55,17],[83,28]])g.set(p[0],p[1],PAL.yellow)}
 else{g.ellipse(74,13,6,6,PAL.yellow);g.rect(14,15,17,2,PAL.paper);g.rect(18,13,10,2,PAL.paper)}
 // distant skyline
 const seed=12+level;for(let x=4;x<90;){const w=6+Math.floor(hash2(x,2,seed)*8),h=10+Math.floor(hash2(x,7,seed)*17);const col=night?'#303653':'#52617a';g.rect(x,52-h,w,h,col);for(let yy=55-h;yy<50;yy+=5)for(let xx=x+2;xx<x+w-1;xx+=4)if(hash2(xx,yy,seed)>.58)g.set(xx,yy,night?PAL.gold:'#ead8b6');x+=w+1}
 g.rect(45,3,3,52,INK);g.rect(3,29,88,3,INK);g.rect(0,55,94,4,INK);g.hline(4,89,54,PAL.paper);
 return g;
})}

function sofaCanvas(level){return cached('sofa',String(level),()=>{
 const g=new Grid(100,62);const ps=[
  ['#514b66','#736b89','#9085a3','#d26a86','#d7b15b'],['#664d46','#89685b','#b18470','#ead0ad','#c96d66'],['#315c5b','#477b77','#66a099','#f2c85c','#f7f2df'],['#493b5b','#655276','#8a6d95','#dc8096','#f2bd4f'],['#213c46','#315764','#467887','#e9dfc9','#f2bd4f']][level];
 // shadow
 g.ellipse(50,55,44,6,alpha(INK,.45));
 // back silhouette and tailored face
 g.rect(9,13,82,30,INK);g.rect(13,10,74,30,INK);g.rect(16,13,68,24,ps[1]);g.hline(17,83,14,mix(ps[2],PAL.white,.35));g.hline(17,83,36,mix(ps[0],INK,.2));

function drawImage(img,x,y,flip=false){ctx.save();ctx.imageSmoothingEnabled=false;if(flip){ctx.translate(Math.round(x)+img.width,Math.round(y));ctx.scale(-1,1);ctx.drawImage(img,0,0)}else ctx.drawImage(img,Math.round(x),Math.round(y));ctx.restore()}

/* ---------- animated room ---------- */
const person={x:54,y:181,tx:118,ty:178,dir:'right',moving:true,restUntil:0,speed:13,lastPick:0};
const personSpots=[[53,181],[82,166],[118,183],[148,168],[194,185],[226,164],[269,185],[304,163],[323,188]];
function choosePersonTarget(now){
 const choices=personSpots.filter(([x,y])=>Math.hypot(x-person.x,y-person.y)>45);
 const p=choices[Math.floor(Math.random()*choices.length)];person.tx=p[0];person.ty=p[1];
 const dx=person.tx-person.x,dy=person.ty-person.y;
 if(Math.abs(dx)>Math.abs(dy))person.dir=dx<0?'left':'right';else person.dir=dy<0?'up':'down';
 person.moving=true;person.lastPick=now;
}
function updatePerson(dt,now){
 if(!person.moving){if(now>=person.restUntil)choosePersonTarget(now);return}
 const dx=person.tx-person.x,dy=person.ty-person.y,d=Math.hypot(dx,dy);
 if(d<1){person.x=person.tx;person.y=person.ty;person.moving=false;person.restUntil=now+1300+Math.random()*2500;return}
 const step=Math.min(d,person.speed*dt);person.x+=dx/d*step;person.y+=dy/d*step;
}

const dog={x:185,y:177,tx:230,ty:174,dir:'right',moving:true,restUntil:0,speed:19,lastPick:0};
const dogSpots=[[72,178],[105,161],[146,188],[190,178],[229,187],[272,170],[302,190],[245,153],[152,158]];
let bubble={text:'',until:0};
let particles=[];
let last=performance.now();
function chooseDogTarget(now){const choices=dogSpots.filter(([x,y])=>Math.hypot(x-dog.x,y-dog.y)>38);const p=choices[Math.floor(Math.random()*choices.length)];dog.tx=p[0];dog.ty=p[1];const dx=dog.tx-dog.x,dy=dog.ty-dog.y;if(Math.abs(dx)>Math.abs(dy))dog.dir=dx<0?'left':'right';else dog.dir=dy<0?'up':'down';dog.moving=true;dog.lastPick=now}
function updateDog(dt,now){if(!dog.moving){if(now>=dog.restUntil)chooseDogTarget(now);return}const dx=dog.tx-dog.x,dy=dog.ty-dog.y,d=Math.hypot(dx,dy);if(d<1){dog.x=dog.tx;dog.y=dog.ty;dog.moving=false;dog.restUntil=now+900+Math.random()*1900;if(Math.random()<.3){bubble.text=['woof!','sniff sniff','comfy.','hmm...'][Math.floor(Math.random()*4)];bubble.until=now+950}return}const step=Math.min(d,dog.speed*dt);dog.x+=dx/d*step;dog.y+=dy/d*step}

const anchors={room:[176,108],sofa:[287,118],bed:[62,117],table:[176,165],plant:[323,121],pet:[dog.x,dog.y]};
function sparkleAt(kind){const a=kind==='pet'?[dog.x,dog.y]:anchors[kind];for(let i=0;i<20;i++){const ang=Math.PI*2*i/20+Math.random()*.4,spd=14+Math.random()*24;particles.push({x:a[0],y:a[1]-12,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-8,life:.8+Math.random()*.45,c:i%3===0?PAL.gold:i%3===1?PAL.white:PAL.cyan})}}
function updateParticles(dt){particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=24*dt});particles=particles.filter(p=>p.life>0)}
function drawParticles(){for(const p of particles){ctx.fillStyle=p.c;const s=p.life>.55?2:1;ctx.fillRect(Math.round(p.x),Math.round(p.y),s,s);if(p.life>.8){ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)+1,s+2,1);ctx.fillRect(Math.round(p.x)+1,Math.round(p.y)-1,1,s+2)}}}

function drawWindow(now){const img=windowCanvas(state.room);drawImage(img,245,15); // animated cloud reflection / light streak
 ctx.fillStyle=state.room>=4?alpha(PAL.gold,.38):alpha(PAL.white,.36);const x=252+Math.floor((now/180)%68);ctx.fillRect(x,27,8,1);if(x<308)ctx.fillRect(x+4,28,10,1)
}
function drawLamp(now){const x=116,y=82;ctx.fillStyle=alpha(PAL.gold,.13+.035*Math.sin(now/240));ctx.fillRect(x-8,y-10,25,24);ctx.fillStyle=INK;ctx.fillRect(x,y,3,27);ctx.fillRect(x-6,y-2,15,4);ctx.fillStyle=PAL.gold;ctx.fillRect(x-4,y-1,11,2);ctx.fillStyle=PAL.cream;ctx.fillRect(x+1,y+3,1,20)}
function drawPerson(now){const frame=person.moving?Math.floor(now/145)%4:0;drawImage(avatarCanvas(person.dir,frame),person.x-15,person.y-41)}
function drawDog(now){const frame=dog.moving?Math.floor(now/135)%4:0;drawImage(dogCanvas(dog.dir,frame,state.pet),dog.x-19,dog.y-27)}
function drawRoom(now){
 drawImage(roomCanvas(state.room),0,0);drawWindow(now);drawLamp(now);
 // Y-sort feet/anchors so characters can pass naturally behind and in front of furniture.
 const actors=[
  {y:130,draw:()=>drawImage(plantCanvas(state.plant),298,state.plant>=4?61:72)},
  {y:138,draw:()=>drawImage(bedCanvas(state.bed),8,76)},
  {y:143,draw:()=>drawImage(sofaCanvas(state.sofa),244,81)},
  {y:person.y,draw:()=>drawPerson(now)},
  {y:188,draw:()=>drawImage(tableCanvas(state.table),145,145)},
  {y:dog.y,draw:()=>drawDog(now)}
 ];
 actors.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
 // little foreground objects: slippers and dog bowl
 ctx.fillStyle=INK;ctx.fillRect(92,187,8,4);ctx.fillRect(103,188,8,4);ctx.fillStyle=PAL.rose;ctx.fillRect(94,188,5,2);ctx.fillRect(105,189,5,2);
 ctx.fillStyle=INK;ctx.fillRect(286,196,18,5);ctx.fillStyle=PAL.sky;ctx.fillRect(289,195,12,4);ctx.fillStyle=PAL.cyan;ctx.fillRect(291,195,8,1);
}
function drawBubble(now){if(now>bubble.until||!bubble.text)return;const x=Math.round(dog.x),y=Math.round(dog.y-39),w=Math.max(34,bubble.text.length*5+10);ctx.fillStyle=INK;ctx.fillRect(x-w/2-2,y-10,w+4,13);ctx.fillStyle=PAL.paper;ctx.fillRect(x-w/2,y-8,w,9);ctx.fillStyle=INK;ctx.font='6px monospace';ctx.textBaseline='top';ctx.fillText(bubble.text,x-w/2+4,y-7);ctx.fillRect(x-2,y+1,4,3);ctx.fillStyle=PAL.paper;ctx.fillRect(x-1,y+1,2,2)}
function render(now){ctx.clearRect(0,0,352,220);drawRoom(now);drawParticles();drawBubble(now)}
function tick(now){const dt=Math.min(.05,(now-last)/1000);last=now;updatePerson(dt,now);updateDog(dt,now);updateParticles(dt);render(now);requestAnimationFrame(tick)}

function invalidateAsset(group){caches[group]?.clear()}
document.getElementById('upgradeBtn').addEventListener('click',()=>{if(state[selected]>=4)return;state[selected]++;save();invalidateAsset(selected);if(selected==='room')caches.room.clear();sparkleAt(selected);bubble.text=selected==='pet'?'Looking fancy!':'Nice upgrade!';bubble.until=performance.now()+1000;syncFocus();if(navigator.vibrate)navigator.vibrate(18)});
document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Reset all My Place upgrades?'))return;Object.keys(state).forEach(k=>state[k]=0);Object.values(caches).forEach(c=>c.clear());save();syncFocus();sparkleAt('room')});

buildDock();syncFocus();choosePersonTarget(performance.now());chooseDogTarget(performance.now());requestAnimationFrame(tick);
</script>
